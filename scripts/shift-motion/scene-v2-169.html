<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  #frame { position: absolute; inset: 0; overflow: hidden; perspective: 2400px;
    background:
      radial-gradient(ellipse 1300px 900px at 50% 42%, #ffffff 0%, #f6f6f7 38%, #e7e7ea 72%, #d6d7db 100%); }
  #floor { position: absolute; left: 50%; top: 1000px; width: 1500px; height: 90px; margin-left: -750px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(30,32,40,.28), rgba(30,32,40,0)); filter: blur(10px); }
  .rig { position: absolute; left: 210px; top: 98px; width: 1500px; height: 843.75px; border-radius: 18px; overflow: hidden;
    background: #fff; transform-origin: 50% 50%; display: none; will-change: transform;
    box-shadow: 0 50px 90px -20px rgba(25,28,40,.30), 0 18px 36px -12px rgba(25,28,40,.18), 0 0 0 1px rgba(20,22,30,.07); }
  .layer { position: absolute; inset: 0; perspective: 1600px; }
  .base, .slice, .stretch { position: absolute; background-repeat: no-repeat; }
  .base { left: 0; top: 0; width: 100%; opacity: 0; }
  .stretch { left: 0; width: 100%; transform-origin: 0 0; opacity: 0; }
  .slice { border-radius: 7px; transform-origin: 50% 50%; opacity: 0; will-change: transform, opacity; }
  .box { position: absolute; background: #fff; border: 1px solid #e3e3e7; border-radius: 7px; opacity: 0; }
  .scrim { position: absolute; inset: 0; background: rgba(40,40,46,.42); opacity: 0; }
  .drawer { position: absolute; top: 0; bottom: 0; background: #fff; box-shadow: -30px 0 60px rgba(0,0,0,.12); }
  .overlay { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
</style>
</head>
<body>
<div id="frame">
  <div id="floor"></div>
</div>
<script>
const IMG = 'IMGDIR/';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  out: x => 1 - Math.pow(1 - x, 3),
  out5: x => 1 - Math.pow(1 - x, 5),
  inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  inOut5: x => x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2,
  back: x => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  sine: x => (1 - Math.cos(Math.PI * x)) / 2,
};
const $ = (tag, cls, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; if (parent) parent.append(e); return e; };
const SVGNS = 'http://www.w3.org/2000/svg';
const S = (tag, attrs, parent) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.append(e); return e; };
const xf = (el, { x = 0, y = 0, s = 1, rx = 0, ry = 0 } = {}) =>
  el.style.transform = `translate3d(${x}px,${y}px,0) rotateX(${rx}deg) rotateY(${ry}deg) scale(${s})`;

const frame = document.getElementById('frame');
const floor = document.getElementById('floor');
const RW = 1500, RH = 843.75, K = RW / 1400, UH = 787.5; // rig size, px per preview unit, rig height in units

// One screenshot, laid out in 1400-wide preview units, top-aligned in the 16:9 rig.
function layer(rig, file, ph) {
  const el = $('div', 'layer', rig);
  const H = ph * K;
  const base = $('div', 'base', el);
  Object.assign(base.style, { height: H + 'px', backgroundImage: `url(${IMG}${file})`, backgroundSize: `${RW}px ${H}px` });
  // stretch the last rows of the screenshot to fill the 16:9 frame
  const st = $('div', 'stretch', el);
  Object.assign(st.style, { top: H - 1 + 'px', height: '3px', backgroundImage: `url(${IMG}${file})`, backgroundSize: `${RW}px ${H}px`,
    backgroundPosition: `0 ${-(H - 4)}px`, transform: `scaleY(${(RH - H + 2) / 3})` });
  const L = { el, base, st, file, ph, H, items: [] };
  L.slice = (x, y, w, h, rad) => {
    const s = $('div', 'slice', el);
    Object.assign(s.style, { left: x * K + 'px', top: y * K + 'px', width: w * K + 'px', height: h * K + 'px',
      backgroundImage: `url(${IMG}${file})`, backgroundSize: `${RW}px ${H}px`, backgroundPosition: `${-x * K}px ${-y * K}px` });
    if (rad != null) s.style.borderRadius = rad + 'px';
    return s;
  };
  L.box = ([x, y, w, h]) => {
    const b = $('div', 'box', el);
    Object.assign(b.style, { left: x * K + 'px', top: y * K + 'px', width: w * K + 'px', height: h * K + 'px' });
    return b;
  };
  // spec: [kind, t, [x,y,w,h], opts]
  L.add = specs => specs.forEach(([kind, t, r, o = {}]) => {
    const box = o.box ? L.box(r) : null;
    const el = L.slice(...r, o.rad);
    if (kind === 'flip') el.style.transformOrigin = '50% 0%';
    L.items.push({ kind, t, r, d: o.d ?? 0.7, el, box });
  });
  L.render = (u, baseAt) => {
    for (const it of L.items) {
      const { kind, t, d, el, box } = it;
      const q = P(u, t, t + d), e = E.out5(q), vis = u >= t;
      if (box) {
        const bq = E.out5(P(u, t - 0.28, t + 0.25));
        box.style.opacity = bq; box.style.transform = `scale(${lerp(0.94, 1, bq)})`;
      }
      el.style.opacity = vis ? 1 : 0;
      el.style.clipPath = ''; el.style.webkitMaskImage = '';
      switch (kind) {
        case 'fade': el.style.opacity = E.out(q); xf(el); break;
        case 'pop': el.style.opacity = P(u, t, t + d * 0.35); xf(el, { y: (1 - e) * 26, s: lerp(0.95, 1, e) }); break;
        case 'scale': { const b = E.back(q); el.style.opacity = P(u, t, t + 0.12); xf(el, { s: lerp(0.3, 1, b) }); break; }
        case 'flip': el.style.opacity = P(u, t, t + 0.18); xf(el, { rx: -82 * (1 - e) }); break;
        case 'card': { const b = E.back(q); el.style.opacity = P(u, t, t + 0.15); xf(el, { rx: 70 * (1 - b), y: 40 * (1 - b), s: lerp(0.86, 1, b) }); break; }
        case 'slideL': el.style.opacity = P(u, t, t + d * 0.4); xf(el, { x: -50 * (1 - e) }); break;
        case 'slideR': el.style.opacity = P(u, t, t + d * 0.4); xf(el, { x: 70 * (1 - e) }); break;
        case 'slideU': el.style.opacity = P(u, t, t + d * 0.4); xf(el, { y: 22 * (1 - e) }); break;
        case 'slideD': el.style.opacity = P(u, t, t + d * 0.4); xf(el, { y: -30 * (1 - e) }); break;
        case 'wipeL': el.style.clipPath = `inset(0 ${(1 - E.inOut(q)) * 100}% 0 0)`; xf(el); break;
        case 'wipeU': el.style.clipPath = `inset(${(1 - E.inOut(q)) * 100}% 0 0 0)`; xf(el); break;
        case 'wipeD': el.style.clipPath = `inset(0 0 ${(1 - E.inOut(q)) * 100}% 0)`; xf(el); break;
        case 'conic': {
          const a = 360 * E.inOut(q);
          el.style.webkitMaskImage = `conic-gradient(from 0deg, #000 ${a}deg, transparent ${a + 0.5}deg)`;
          xf(el, { s: lerp(0.85, 1, E.out5(q)) }); break;
        }
      }
    }
    const bq = P(u, baseAt, baseAt + 0.35);
    L.base.style.opacity = bq; L.st.style.opacity = bq;
  };
  return L;
}

// =====================================================================
// pages
// =====================================================================
const pages = [];
const page = (life, axis, build) => {
  const rig = $('div', 'rig', frame);
  const render = build ? build(rig) : () => {};
  pages.push({ rig, life, axis, render });
};
const rows = (n, x, y0, pitch, w, h, t0, dt, kind = 'slideU') =>
  Array.from({ length: n }, (_, i) => [kind, t0 + i * dt, [x, y0 + i * pitch, w, h ?? pitch], { rad: 0, d: 0.55 }]);

    ['fade', 1.3, [540, 318, 490, 18], { rad: 0 }],

// closing blank screen = the opening state, so the video loops
page(0, 'y', null);

// =====================================================================
// timeline: each page lives, then flips into the next
// =====================================================================
const FLIP = 1.05;
let acc = 0;
for (const p of pages) { p.start = acc; acc += p.life + FLIP; }
const DURATION = pages[pages.length - 1].start;
window.DURATION = DURATION;

const pose = u => ({ rx: 7 - 2 * E.sine(P(u, 0, 5.5)), ry: -9 + 12 * E.sine(P(u, 0, 5.5)) });
function place(p, u, extra = {}) {
  const { rx, ry } = extra.pose || pose(u);
  const a = extra.a || 0, s = extra.s || 1, z = extra.z || 0;
  const RX = rx + (p.axis === 'x' ? a : 0), RY = ry + (p.axis === 'y' ? a : 0);
  p.rig.style.transform = `translateZ(${z}px) rotateX(${RX}deg) rotateY(${RY}deg) scale(${s})`;
  p.rig.style.display = 'block';
  // floor shadow follows the card's projected footprint
  const wx = Math.abs(Math.cos(RY * Math.PI / 180)), wy = Math.abs(Math.cos(RX * Math.PI / 180));
  floor.style.transform = `scale(${s * Math.max(wx, 0.08)}, ${0.7 + 0.3 * wy})`;
  floor.style.opacity = 0.55 + 0.45 * wy;
}

window.render = t => {
  pages.forEach(p => p.rig.style.display = 'none');
  for (let i = 0; i < pages.length; i++) {
    const p = pages[i], next = pages[i + 1];
    const u = t - p.start, flipAt = p.life;
    if (u < 0 || (next && t >= next.start)) continue;
    if (u < flipAt || !next) { p.render(u); place(p, u); break; }
    // flip: 0→180 around this page's axis; halfway the next page takes over, blank
    const q = E.inOut5(P(u, flipAt, flipAt + FLIP)), ang = 180 * q;
    const lift = Math.sin(Math.PI * q);
    const s = 1 - 0.1 * lift, z = -160 * lift;
    const p0 = pose(flipAt), p1 = pose(0);
    const ps = { rx: lerp(p0.rx, p1.rx, q), ry: lerp(p0.ry, p1.ry, q) };
    if (ang < 90) { p.render(u); place(p, u, { a: ang, s, z, pose: ps }); }
    else {
      next.render(-1);
      // the incoming face continues the same rotation, pose taken from its own clock at 0
      const pp = { ...next, axis: p.axis };
      place(pp, 0, { a: ang - 180, s, z, pose: ps });
    }
    break;
  }
};
