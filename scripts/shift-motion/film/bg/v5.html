<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shift film background v5 (time-driven texture)</title>
<style>
html,body{margin:0;background:#fff}
#f{position:relative;width:1920px;height:1080px;overflow:hidden;background:#fff}
.g{position:absolute}
.dg{position:absolute;width:28px;height:32px;font:500 16px/32px ui-monospace,'SF Mono',Menlo,Consolas,monospace;text-align:center}
</style>
</head>
<body>
<div id="f">
<!-- 1 · gradient from the reference: violet-lavender held across the top, easing through lilac to pale sky -->
<div class="g" style="left:0;top:0;width:1920px;height:1080px;background:linear-gradient(180deg,#bba8f8 0%,#bba8f8 14%,#bdabf8 25%,#c6bafa 35%,#cfc9fa 45%,#d7d7fa 55%,#e6edfb 65%,#f3f8fd 75%,#fdfeff 88%,#fff 100%)"></div>
<!-- 2 · letter field: each character takes its colour from the gradient behind it, multiplied in -->
<div class="g" style="left:0;top:0;width:1920px;height:1080px;-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 56%,rgba(0,0,0,0) 78%);mask-image:linear-gradient(180deg,#000 0%,#000 56%,rgba(0,0,0,0) 78%)">
<div class="g" style="left:0;top:0;width:1920px;height:1080px;-webkit-mask-image:radial-gradient(ellipse 34% 30% at 50% 48%,rgba(0,0,0,.35) 0%,#000 100%);mask-image:radial-gradient(ellipse 34% 30% at 50% 48%,rgba(0,0,0,.35) 0%,#000 100%)">
<div id="field" class="g" style="left:0;top:0;width:1920px;height:1080px;mix-blend-mode:multiply;filter:blur(.35px);opacity:.95;-webkit-mask-image:radial-gradient(ellipse 40% 50% at 0 90%,rgba(0,0,0,0) 30%,#000 75%);mask-image:radial-gradient(ellipse 40% 50% at 0 90%,rgba(0,0,0,0) 30%,#000 75%)"></div>
</div>
</div>
<!-- 3 · grain (the noise seed steps every 3 frames, so it shimmers like film and never flickers per frame) -->
<svg class="g" width="1920" height="1080" viewBox="0 0 1920 1080" style="left:0;top:0;mix-blend-mode:soft-light;opacity:.5">
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
<rect width="1920" height="1080" filter="url(#grain)"></rect>
</svg>
</div>
<script>
// Every value below is a pure function of t, so a frame is identical wherever and whenever it is rendered.
const DURATION = 40.3
const CH = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ!@#$*()-_+=/[];:.,0123456789'
const hash = (a, b) => { let x = Math.imul(a | 0, 73856093) ^ Math.imul(b | 0, 19349663); x = Math.imul(x ^ (x >>> 13), 1274126177); x ^= x >>> 16; return (x >>> 0) / 4294967296 }
const W = 28, H = 32, COLS = 69, ROWS = 34
const stops = [[0, [187, 168, 248]], [.14, [187, 168, 248]], [.25, [189, 171, 248]], [.35, [198, 186, 250]], [.45, [207, 201, 250]], [.55, [215, 215, 250]], [.65, [230, 237, 251]], [.75, [243, 248, 253]], [.88, [253, 254, 255]], [1, [255, 255, 255]]]
const local = y => { const t = Math.min(1, Math.max(0, y / 1080)); for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) { const [t0, a] = stops[i - 1], [t1, b] = stops[i], u = (t - t0) / (t1 - t0 || 1); return a.map((v, j) => v + (b[j] - v) * u) } return stops[stops.length - 1][1] }
const hs = ([r, g, b]) => { r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn; let h = 0, s = 0; if (d) { s = d / (1 - Math.abs(2 * l - 1)); h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; if (h < 0) h += 360 } return [h, s] }
const tone = (y, light, shift) => { const [h, s] = hs(local(y)); return `hsl(${Math.round(h + shift)} ${Math.round(Math.min(1, s + .1) * 100)}% ${light}%)` }
const flow = (x, y, t) => .5 + .25 * Math.sin(x * .011 + y * .007 + 1.3 + t * .22) + .15 * Math.sin(x * .023 - y * .017 + 4.1 - t * .17) + .1 * Math.sin(x * .005 + y * .031 + 2.2 + t * .13)
const clusters = Array.from({ length: 8 }, (_, j) => ({ r: Math.floor(hash(j, 71) * ROWS), c0: Math.floor(hash(j, 72) * (COLS - 8)), len: 4 + Math.floor(hash(j, 73) * 5), P: 5.5 + 1.1 * j, off: hash(j, 74) * 9, hot: hash(j, 75) < .6 }))

const field = document.getElementById('field'), cells = []
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
  const el = document.createElement('div'); el.className = 'dg'; el.style.left = c * W + 'px'; el.style.top = r * H + 'px'
  const i = r * COLS + c; field.appendChild(el)
  cells.push({ el, i, r, c, x: c * W, y: r * H, d: 1.4 + 3.2 * hash(i, 1), ph: 4 * hash(i, 2), g0: hash(i, 5) * 10, base: tone(r * H, 54, 0), hot: tone(r * H, 36, 0), cool: tone(r * H, 40, 22), ch: '', op: '', col: '' })
}
const clusterOf = new Map()
clusters.forEach((cl, j) => { for (let k = 0; k < cl.len; k++) clusterOf.set(cl.r * COLS + cl.c0 + k, { j, k, cl }) })

const fract = v => v - Math.floor(v)

function renderBg(t) {
  for (const k of cells) {
    const slot = Math.floor((t + k.ph) / k.d)
    let ch = CH[Math.floor(hash(k.i, slot + 1000) * CH.length)]
    let op = .05 + .24 * Math.pow(Math.min(1, Math.max(0, flow(k.x, k.y, t))), 1.6), col = k.base
    const g = Math.floor(t / 1.6 + k.g0), u = t / 1.6 + k.g0 - g          // glitch events: a quick rise, a slow decay
    if (hash(k.i, g + 5000) < .03) {
      const env = u < .12 ? u / .12 : Math.exp(-(u - .12) * 3.2)
      op += (.9 - op) * env; col = hash(k.i, g + 9000) < .6 ? k.hot : k.cool
      if (env > .2) ch = CH[Math.floor(hash(k.i, Math.floor(t * 8) + 3000) * CH.length)]
    }
    const cl = clusterOf.get(k.i)
    if (cl) {
      const uu = ((t + cl.cl.off) % cl.cl.P) / cl.cl.P
      if (uu < .22) { const env = Math.sin(Math.PI * uu / .22), lit = Math.min(1, Math.max(0, env * 1.6 - cl.k / cl.cl.len * .6)); if (lit > 0) { op += (.9 - op) * lit; col = cl.cl.hot ? k.hot : k.cool; ch = CH[Math.floor(hash(k.i, Math.floor(t * 8) + 4000) * CH.length)] } }
    }
    if (k.ch !== ch) { k.el.textContent = ch; k.ch = ch }
    const o = op.toFixed(3); if (k.op !== o) { k.el.style.opacity = o; k.op = o }
    if (k.col !== col) { k.el.style.color = col; k.col = col }
  }
  document.getElementById('turb').setAttribute('seed', 5 + Math.floor(t * 10))
}
window.renderBg = renderBg; window.DURATION = DURATION; window.ready = Promise.resolve(true)
renderBg(parseFloat(new URLSearchParams(location.search).get('t') || '0'))
</script>
</body>
</html>
