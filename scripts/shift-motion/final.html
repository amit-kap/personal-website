<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Shift motion — final motion reference (HTML). The offline storyboard (offline.html) with everything animated:
     element-level wave builds, every moment, flips, card push-ins, intro/outro tumble, background plate.
     Served from the repo root (launch.json "shift-motion-preview"): /scripts/shift-motion/final.html?play
     ?bg=<url> swaps the background plate. Blender takes this over later (blender/export-offline.mjs pattern). -->
<style>
  @font-face { font-family: Geist; font-weight: 400; src: url(/scripts/shift-motion/fonts/geist-sans-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: Geist; font-weight: 500; src: url(/scripts/shift-motion/fonts/geist-sans-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: Geist; font-weight: 600; src: url(/scripts/shift-motion/fonts/geist-sans-latin-600-normal.woff2) format('woff2'); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #e6e5e1; }
  #frame { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #e6e5e1 center / cover no-repeat; }
  /* contact shadow only — the plate has no floor to reflect in */
  #floor { position: absolute; left: 50%; width: 1600px; height: 70px; margin-left: -800px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(52,46,36,.34), rgba(52,46,36,0)); filter: blur(14px); }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; perspective: 2600px; }
  #card { position: absolute; border-radius: 26px; transform-origin: 50% 50%;
    background: linear-gradient(165deg, rgba(255,255,255,.92) 0%, rgba(250,250,252,.62) 38%, rgba(232,233,238,.72) 100%);
    box-shadow: inset 0 1.5px 0 #fff, inset 0 -1px 0 rgba(170,172,182,.35), inset 0 0 0 1px rgba(255,255,255,.55),
      0 0 0 1px rgba(20,22,30,.07), 0 70px 110px -40px rgba(40,34,24,.36), 0 24px 46px -22px rgba(40,34,24,.2); }
  #screen { position: absolute; left: 12px; top: 12px; border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 0 0 1px rgba(20,22,30,.09); }
  /* browser title bar — the site's .winbar, scaled to the card */
  #winbar { position: absolute; left: 0; top: 0; right: 0; height: 40px; padding: 0 20px; display: flex; gap: 11px; align-items: center;
    background: #fbfbfa; border-bottom: 1px solid rgba(17,17,17,.08); z-index: 2; }
  #winbar i { width: 13px; height: 13px; border-radius: 999px; }
  #winbar i:nth-child(1) { background: #f0685e; } #winbar i:nth-child(2) { background: #f6bf4f; } #winbar i:nth-child(3) { background: #5fc454; }
  #page { position: absolute; left: 0; top: 40px; width: 1400px; transform-origin: 0 0; }
  .layer { position: absolute; left: 0; top: 0; width: 1400px; perspective: 1600px; display: none; }
  .layer > * { position: absolute; }
  .base { left: 0; top: 0; width: 1400px; background-repeat: no-repeat; opacity: 0; }
  .slice { background-repeat: no-repeat; border-radius: 7px; transform-origin: 50% 50%; opacity: 0; }
  .slice > * { position: absolute; }
  .flip { transform-origin: 50% 0%; }
  .box { background: #fff; border: 1px solid #e3e3e7; border-radius: 7px; opacity: 0; }
  /* caption layer — flat on the frame, above the card (not part of #screen, so the Blender export never sees it) */
  /* typography and wash come from the approved Claude Design canvas (Overused Grotesk, Shift violet hook, lavender wash) */
  @font-face { font-family: 'Overused Grotesk'; font-weight: 500; src: url(/scripts/shift-motion/fonts/OverusedGrotesk-Medium.woff2) format('woff2'); }
  @font-face { font-family: 'Overused Grotesk'; font-weight: 700; src: url(/scripts/shift-motion/fonts/OverusedGrotesk-Bold.woff2) format('woff2'); }
  #cap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; z-index: 5; font-family: 'Overused Grotesk', 'Helvetica Neue', Arial, sans-serif; }
  #wash { position: absolute; left: 0; bottom: -2px; width: 1700px; height: 800px; opacity: 0;
    background: radial-gradient(ellipse 75% 85% at 16% 100%, rgba(244,243,254,.84) 0%, rgba(244,243,254,.62) 38%, rgba(244,243,254,0) 80%); }
  #txt { position: absolute; left: 128px; bottom: 104px; font-size: 80px; line-height: 1; letter-spacing: -.03em; color: #08080a; }
  #txt > div { font-weight: 500; white-space: nowrap; }
  #txt .ch { opacity: 0; }
  /* block cursor: zero-width anchor so it never shifts the text; the block hangs off it */
  #txt .cur { display: inline-block; width: 0; height: 0; position: relative; }
  #txt .cur i { position: absolute; left: .05em; bottom: -.02em; width: .44em; height: .76em; background: #08080a; }
  #txt > div.hook { font-weight: 700; color: #7c5cd6; }
  /* digital background layer (approved in the Claude Design canvas): behind the card, above the plate */
  #digi { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; mix-blend-mode: var(--digi-mode, multiply); filter: blur(.45px); opacity: .9; }
  #digi .grid { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    -webkit-mask-image: radial-gradient(ellipse 68% 72% at 50% 50%, rgba(0,0,0,.3) 0%, #000 100%); mask-image: radial-gradient(ellipse 68% 72% at 50% 50%, rgba(0,0,0,.3) 0%, #000 100%); }
  #digi .cell { position: absolute; width: 40px; height: 40px; color: #7c5cd6; font: 500 15px/40px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; text-align: center; }
  #digi .sq { position: absolute; width: 10px; height: 10px; background: #7c5cd6; }
  #digi .bar { width: 6px; background: #7c5cd6; }
  #end { position: absolute; left: 0; right: 0; top: 40px; bottom: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 44px; background: #fff; }
  #lock { display: flex; align-items: center; gap: 26px; }
  #sub { font: 500 46px/1.1 'Overused Grotesk', 'Helvetica Neue', Arial, sans-serif; color: #4a4a52; letter-spacing: -.02em; white-space: nowrap; opacity: 0; }
  #end img { width: 120px; height: 120px; filter: brightness(0); }   /* icon.svg is now a pale fill for dark surfaces; this card is white */
  #end span { font: 600 134px/1 Geist, sans-serif; color: #09090b; letter-spacing: -.045em; margin-top: -8px; display: inline-block; }
</style>
</head>
<body>
<div id="frame"><div id="cap"><div id="wash"></div><div id="txt"></div></div><div id="floor"></div><div id="stage"><div id="card"><div id="screen"><div id="winbar"><i></i><i></i><i></i></div><div id="page"></div>
  <div id="end"><div id="lock"><img src="/src/content/experience/shift/icon.svg"><span>Shift</span></div><div id="sub">Third-Party Security For The Agentic Era</div></div></div></div></div></div>
<script>
const IMG = '/src/content/experience/shift/';
const SCREENS = {
  '01': ['01-shift-dashboard.webp', 706.3], '02': ['02-inventory-vendors-page.webp', 701.5], '03': ['03-inventory-vendors-card.png', 704.6],
  '04': ['04-vendor-access-graph.webp', 705.8], '05': ['05-threat-center.webp', 705.8], '06': ['06-integrations-grid.jpg', 700],
  '07': ['07-assessment-flow-1.webp', 705.8],
};
const GREEN = '#22c55e', PICKED = 'rgba(124,58,237,.07)';   // selected-row tint, shared by every row click
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), P = (t, a, b) => clamp((t - a) / (b - a)), lerp = (a, b, x) => a + (b - a) * x;
const E = {
  out: x => 1 - Math.pow(1 - x, 3), out5: x => 1 - Math.pow(1 - x, 5), in: x => x * x * x,
  inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  inOut5: x => x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2,
  back: x => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  sine: x => (1 - Math.cos(Math.PI * x)) / 2,
};
const $ = (tag, parent, css = {}) => { const e = document.createElement(tag); Object.assign(e.style, css); if (parent) parent.append(e); return e; };
const R = ([x, y, w, h]) => ({ left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
const xf = (el, { x = 0, y = 0, s = 1, rx = 0 } = {}, pre = '') => el.style.transform = `${pre}translate3d(${x}px,${y}px,0) rotateX(${rx}deg) scale(${s})`;

// ---------------------------------------------------------------- layers: one screenshot sliced into UI pieces
// (the scene.html engine, in page units). Each page builds as one continuous wave top → bottom; the full
// screenshot fills in just behind the wave front.
const DS = 0.62;   // authored item durations → seconds
function layer(key) {
  const [file, H] = SCREENS[key];
  const el = $('div', document.getElementById('page'), { height: H + 'px' }); el.className = 'layer';
  const base = $('div', el, { height: H + 'px', backgroundImage: `url(${IMG}${file})`, backgroundSize: `1400px ${H}px` }); base.className = 'base';
  const L = { key, el, base, H, file, items: [], wv: { t0: -99, dur: 0.01, lag: 0 } };
  L.slice = (r, parent = el) => {
    const s = $('div', parent, { ...R(r), backgroundImage: `url(${IMG}${file})`, backgroundSize: `1400px ${H}px`, backgroundPosition: `${-r[0]}px ${-r[1]}px` });
    s.className = 'slice'; return s;
  };
  L.add = specs => specs.forEach(([kind, , r, o = {}]) => {
    const box = o.box ? $('div', el, R(r)) : null; if (box) box.className = 'box';
    const s = L.slice(r); if (o.rad != null) s.style.borderRadius = o.rad + 'px'; if (kind === 'flip') s.classList.add('flip');
    L.items.push({ kind, t: 0, r, d: (o.d ?? 0.7) * DS, el: s, box });
  });
  L.wave = (t0, dur, lag = 0.25) => { L.wv = { t0, dur, lag }; for (const it of L.items) it.t = t0 + (it.r[1] / H) * dur + (it.r[0] / 1400) * 0.15; };
  L.find = r => L.items.find(it => it.r.every((v, k) => Math.abs(v - r[k]) < 0.5));
  L.render = u => {
    for (const it of L.items) {
      const { kind, t, d, el: s, box } = it, q = P(u, t, t + d), e = E.out5(q);
      if (box) { const bq = E.out5(P(u, t - 0.18, t + 0.16)); box.style.opacity = bq; box.style.transform = `scale(${lerp(0.94, 1, bq)})`; }
      let op = u >= t ? 1 : 0; s.style.clipPath = ''; s.style.webkitMaskImage = '';
      const fx = it.fx ? it.fx(u) : { dy: 0, op: 1 }, pre = fx.dy ? `translateY(${fx.dy}px) ` : '';
      switch (kind) {
        case 'fade': op = E.out(q); xf(s, {}, pre); break;
        case 'pop': op = P(u, t, t + d * 0.35); xf(s, { y: (1 - e) * 24, s: lerp(0.95, 1, e) }, pre); break;
        case 'scale': { const b = E.back(q); op = P(u, t, t + 0.08); xf(s, { s: lerp(0.3, 1, b) }, pre); break; }
        case 'flip': op = P(u, t, t + 0.12); xf(s, { rx: -82 * (1 - e) }, pre); break;
        case 'card': { const b = E.back(q); op = P(u, t, t + 0.1); xf(s, { rx: 70 * (1 - b), y: 36 * (1 - b), s: lerp(0.86, 1, b) }, pre); break; }
        case 'slideL': op = P(u, t, t + d * 0.4); xf(s, { x: -45 * (1 - e) }, pre); break;
        case 'slideR': op = P(u, t, t + d * 0.4); xf(s, { x: 63 * (1 - e) }, pre); break;
        case 'slideU': op = P(u, t, t + d * 0.4); xf(s, { y: 20 * (1 - e) }, pre); break;
        case 'slideD': op = P(u, t, t + d * 0.4); xf(s, { y: -27 * (1 - e) }, pre); break;
        case 'wipeL': s.style.clipPath = `inset(0 ${(1 - E.inOut(q)) * 100}% 0 0)`; xf(s, {}, pre); break;
        case 'wipeU': s.style.clipPath = `inset(${(1 - E.inOut(q)) * 100}% 0 0 0)`; xf(s, {}, pre); break;
        case 'wipeD': s.style.clipPath = `inset(0 0 ${(1 - E.inOut(q)) * 100}% 0)`; xf(s, {}, pre); break;
        case 'conic': { const a = 360 * E.inOut(q); s.style.webkitMaskImage = `conic-gradient(from 0deg, #000 ${a}deg, transparent ${a + 0.5}deg)`; xf(s, { s: lerp(0.85, 1, E.out5(q)) }, pre); break; }
      }
      s.style.opacity = op * fx.op;
    }
    const { t0, dur, lag } = L.wv, bq = P(u, t0 + lag, t0 + lag + dur), edge = lerp(-18, 100, bq);
    base.style.opacity = bq > 0 ? 1 : 0;
    base.style.webkitMaskImage = bq >= 1 ? '' : `linear-gradient(180deg, #000 ${edge}%, transparent ${edge + 18}%)`;
    L.fx && L.fx(u);
  };
  return L;
}
const rows = (n, x, y0, pitch, w, h, kind = 'slideU') => Array.from({ length: n }, (_, i) => [kind, 0, [x, y0 + i * pitch, w, h ?? pitch], { rad: 0, d: 0.55 }]);

const CURSOR = '<svg viewBox="0 0 12 18" width="12" height="18" style="overflow:visible"><path d="M0 0 L0 14 L3.6 10.8 L6.2 16.6 L8.4 15.6 L5.9 9.9 L10.8 9.9 Z" fill="#111" stroke="#fff" stroke-width="1.1" stroke-linejoin="round"/></svg>';
function cursor(parent) { const c = $('div', parent, { width: '12px', height: '18px', opacity: 0, filter: 'drop-shadow(0 1px 1.5px rgba(0,0,0,.3))', zIndex: 5 }); c.innerHTML = CURSOR; return c; }
// cursor glide + click: from (x0,y0) to (x1,y1) over [a, a+0.35], press at a+0.35
function glide(c, u, a, [x0, y0], [x1, y1], until) {
  const q = E.inOut(P(u, a, a + 0.35));
  c.style.opacity = u > a - 0.05 && u < until ? 1 : 0;
  c.style.left = lerp(x0, x1, q) + 'px'; c.style.top = lerp(y0, y1, q) + 'px';
  c.style.transform = `scale(${1 - 0.15 * Math.sin(Math.PI * P(u, a + 0.36, a + 0.54))})`;
}
// the security-score donut, drawn as vectors over the screenshot's (same segmented ring, badge, score, pill) —
// set(score, grade 0 = B → 1 = F, pill 0 = Moderate → 1 = Critical)
const SVGNS = 'http://www.w3.org/2000/svg';
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixRgb = (a, b, x) => hexRgb(a).map((v, i) => Math.round(lerp(v, hexRgb(b)[i], x)));
const SCORE_STOPS = [[74, '#b2e458'], [54, '#f59e0b'], [34, '#ef4444']];
const scoreRgb = sc => { for (let i = 1; i < SCORE_STOPS.length; i++) if (sc >= SCORE_STOPS[i][0]) return mixRgb(SCORE_STOPS[i][1], SCORE_STOPS[i - 1][1], (sc - SCORE_STOPS[i][0]) / (SCORE_STOPS[i - 1][0] - SCORE_STOPS[i][0])); return hexRgb('#ef4444'); };
function scoreDonut(parent) {
  const CX = 554.6, CY = 237, RR = 49.75, G = 0.7;
  const box = $('div', parent, { position: 'absolute', ...R([CX - 57, CY - 57, 114, 114]), background: '#fff', borderRadius: '50%' });
  const svg = document.createElementNS(SVGNS, 'svg'); box.append(svg);
  Object.entries({ viewBox: '0 0 114 114', width: 114, height: 114 }).forEach(([k, v]) => svg.setAttribute(k, v));
  svg.style.cssText = 'position:absolute;left:0;top:0;overflow:visible';
  const arc = (a0, a1) => { const p = a => [57 + RR * Math.sin(a * Math.PI / 180), 57 - RR * Math.cos(a * Math.PI / 180)];
    const [x0, y0] = p(a0), [x1, y1] = p(a1); return `M${x0} ${y0} A${RR} ${RR} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`; };
  const path = (d, stroke) => { const e = document.createElementNS(SVGNS, 'path'); e.setAttribute('d', d); e.setAttribute('fill', 'none'); e.setAttribute('stroke', stroke); e.setAttribute('stroke-width', 5.5); svg.append(e); return e; };
  const segs = [0, 1, 2, 3, 4].map(i => { const a0 = i * 72 + G, a1 = (i + 1) * 72 - G; path(arc(a0, a1), '#e4e4e7'); return { a0, a1, el: path('', '#000') }; });
  const badge = $('div', box, { position: 'absolute', ...R([57 - 10.4, 57 - 25.7, 20.8, 20.8]), borderRadius: '2.7px', overflow: 'hidden' });
  const letter = g => { const e = $('div', badge, { position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', font: '600 10.5px Geist' }); e.textContent = g; return e; };
  const LB = letter('B'), LF = letter('F');
  const num = $('div', box, { position: 'absolute', ...R([0, 57 + 6 - 5, 114, 10]), textAlign: 'center', font: '400 7.4px/10px Geist', color: '#71717a' });
  const pill = (text, bg, color) => { const e = $('div', box, { position: 'absolute', left: '50%', top: 57 + 21.6 - 4.9 + 'px', height: '9.8px', padding: '0 4.3px', borderRadius: '4.9px',
    font: '400 6.6px/9.8px Geist', whiteSpace: 'nowrap', background: bg, color, transform: 'translateX(-50%)' }); e.textContent = text; return e; };
  const P1 = pill('Moderate risk', '#f4f4f5', '#18181b'), P2 = pill('Critical risk', '#fee2e2', '#dc2626');
  return (sc, g, pq) => {
    const [r, gg, b] = scoreRgb(sc), c = `rgb(${r},${gg},${b})`, end = sc * 3.6;
    segs.forEach(s => { const a1 = Math.min(s.a1, end); s.el.setAttribute('d', a1 > s.a0 ? arc(s.a0, a1) : ''); s.el.setAttribute('stroke', c); });
    badge.style.background = `rgba(${r},${gg},${b},.14)`;
    LB.style.color = LF.style.color = c;
    LB.style.transform = `translateY(${-100 * g}%)`; LF.style.transform = `translateY(${100 * (1 - g)}%)`;
    num.innerHTML = `<span style="color:#18181b">${Math.round(sc)}</span> / 100`;
    P1.style.opacity = 1 - pq; P2.style.opacity = pq; P2.style.transform = `translateX(-50%) scale(${lerp(0.88, 1, E.back(pq))})`;
  };
}
// a number that rolls from a to b (old value slides up and out, new one in from below)
function roller(parent, r, font, a, b, dx = 2, dy = 0) {
  const w = $('div', parent, { ...R(r), background: '#fff', overflow: 'hidden', font, color: '#09090b', lineHeight: r[3] + 'px' });
  const A = $('span', w, { position: 'absolute', left: dx + 'px', top: dy + 'px' }), B = $('span', w, { position: 'absolute', left: dx + 'px', top: dy + 'px' });
  A.textContent = a; B.textContent = b;
  return q => { A.style.transform = `translateY(${-100 * q}%)`; B.style.transform = `translateY(${100 * (1 - q)}%)`; A.style.opacity = 1 - q; B.style.opacity = q; };
}

// ---------------------------------------------------------------- shots: same timing + camera as offline.html
const W = 'wide', V = (cx, cy, s) => ({ cx, cy, s });
const STAT = V(654, 138, 2.6), FIND = V(268, 560, 2.6), ROW = V(330, 521, 2.3), SCORE = V(600, 230, 2.3);
const NODE = V(724.5, 212, 3.0), LIST = V(330, 330, 2.0), JIRA = V(801, 457, 2.6), BOXV = V(420, 535, 2.6);
// [screen, seconds, view, kind, opts] — opts.id names a moment so the screen's animation can find its start
const SHOTS = [
  ['blank', 0.5, W, 'hold'],
  ['01', 1.2, W, 'build'], ['01', 2.0, W, 'hold'], ['01', 0.5, STAT, 'move'], ['01', 0.6, STAT, 'moment', { id: 'tick' }],
  ['01', 0.8, FIND, 'move', { id: 'follow' }], ['01', 1.5, FIND, 'moment', { id: 'land' }],   // the flip starts ~0.15s after the row click
  ['02', 1.1, W, 'build'], ['02', 1.9, W, 'hold'], ['02', 0.5, ROW, 'move'], ['02', 0.35, ROW, 'moment', { id: 'select' }],
  ['02', 0.75, W, 'move', { id: 'drawer' }],   // the panel opens on the click, the camera pulls back with it
  ['03', 0.5, SCORE, 'move'], ['03', 1.5, SCORE, 'moment', { id: 'score' }], ['03', 0.5, SCORE, 'hold'],
  ['04', 1.2, W, 'build'], ['04', 1.9, W, 'hold'], ['04', 0.6, NODE, 'move'], ['04', 1.2, NODE, 'moment', { id: 'sites' }], ['04', 0.5, NODE, 'hold'],
  ['05', 1.1, W, 'build'], ['05', 1.9, W, 'hold'], ['05', 0.5, LIST, 'move'], ['05', 1.4, LIST, 'moment', { id: 'threat' }], ['05', 0.4, LIST, 'hold'],
  ['06', 1.1, W, 'build'], ['06', 1.9, W, 'hold'], ['06', 0.5, JIRA, 'move'], ['06', 0.5, JIRA, 'moment', { id: 'press' }],
  ['06', 1.2, JIRA, 'moment', { id: 'connected' }], ['06', 0.4, JIRA, 'hold'],
  ['07', 1.1, W, 'build'], ['07', 1.9, W, 'hold'], ['07', 0.5, BOXV, 'move'], ['07', 0.9, BOXV, 'moment', { id: 'count' }],
  ['07', 0.5, BOXV, 'moment', { id: 'cursor' }], ['07', 0.5, BOXV, 'moment', { id: 'click' }], ['07', 0.4, BOXV, 'hold'],
  ['end', 4.0, W, 'hold', { id: 'logo' }],
];
let acc = 0; const starts = SHOTS.map(s => { const a = acc; acc += s[1]; return a; });
const DURATION = acc;
const firstOf = key => starts[SHOTS.findIndex(s => s[0] === key)];
const at = id => { const i = SHOTS.findIndex(s => s[4]?.id === id); return starts[i] - firstOf(SHOTS[i][0]); };   // screen-local start

// ---------------------------------------------------------------- pages
const LAYERS = {};
const LEAD = 0.3;   // builds start this long before the flip lands
const DIGIT = [3.1, -0.3];   // 01 counter glyph offset inside its patch (tuned against the screenshot)
// 01 — Dashboard: Shadow Vendors ticks 5 → 6, the camera follows the alert down, a new critical finding lands on top
{
  const L = LAYERS['01'] = layer('01');
  L.add([
    ['slideD', 0, [0, 0, 1400, 38], { rad: 0 }], ['fade', 0, [0, 44, 1046, 60], { rad: 0 }], ['slideR', 0, [1050, 40, 350, 666], { rad: 0, d: 0.8 }],
