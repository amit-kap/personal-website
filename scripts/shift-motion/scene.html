<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Geist; font-weight: 600; src: url(FONTDIR/geist-sans-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: Geist; font-weight: 400; src: url(FONTDIR/geist-sans-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: Geist; font-weight: 500; src: url(FONTDIR/geist-sans-latin-500-normal.woff2) format('woff2'); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #e9e9ec; }
  #frame { position: absolute; inset: 0; overflow: hidden;
    background: radial-gradient(ellipse 1250px 860px at 50% 40%, #ffffff 0%, #f7f7f8 30%, #ebebee 62%, #d9dade 100%); }
  #noise { position: absolute; inset: 0; opacity: .09; mix-blend-mode: multiply; background-size: 240px 240px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.6 -.3'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"); }
  #floor { position: absolute; left: 50%; width: 1600px; height: 80px; margin-left: -800px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(30,32,40,.30), rgba(30,32,40,0)); filter: blur(12px); }
  /* stage bottom = the mirror line for the floor reflection */
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 932px; perspective: 2600px;
    -webkit-box-reflect: below 0 linear-gradient(transparent 72%, rgba(0,0,0,.16)); }
  #card { position: absolute; border-radius: 26px; transform-origin: 50% 50%;
    background: linear-gradient(165deg, rgba(255,255,255,.92) 0%, rgba(250,250,252,.62) 38%, rgba(232,233,238,.72) 100%);
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,1), inset 0 -1px 0 rgba(170,172,182,.35), inset 0 0 0 1px rgba(255,255,255,.55),
      0 0 0 1px rgba(20,22,30,.07), 0 70px 110px -40px rgba(25,28,40,.38), 0 24px 46px -22px rgba(25,28,40,.22); }
  #screen { position: absolute; inset: 12px; border-radius: 16px; overflow: hidden; background: #fff;
    box-shadow: 0 0 0 1px rgba(20,22,30,.09); }
  #glass, #sheen { position: absolute; inset: 0; border-radius: 26px; pointer-events: none; overflow: hidden; }
  /* a faint coat of glass over the whole face: brighter at the top, a cool tint at the bottom */
  #glass { background:
      linear-gradient(180deg, rgba(255,255,255,.20) 0%, rgba(255,255,255,0) 30%, rgba(0,0,0,0) 70%, rgba(110,116,140,.06) 100%); }
  #sheen i { position: absolute; top: -20%; height: 140%; width: 34%; left: 0; display: block;
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.34) 38%, rgba(255,255,255,.55) 50%, rgba(255,255,255,.34) 62%, rgba(255,255,255,0) 100%); }
  #sheen b { position: absolute; top: -20%; height: 140%; width: 9%; left: 0; display: block;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.45), rgba(255,255,255,0)); }
  .pg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: none; }
  .layer { position: absolute; inset: 0; perspective: 1600px; }
  .base, .slice { position: absolute; background-repeat: no-repeat; }
  .base { left: 0; top: 0; width: 100%; opacity: 0; }
  .slice { border-radius: 7px; transform-origin: 50% 50%; opacity: 0; }
  .box { position: absolute; background: #fff; border: 1px solid #e3e3e7; border-radius: 7px; opacity: 0; }
  .scrim { position: absolute; inset: 0; background: rgba(40,40,46,.42); opacity: 0; }
  .drawer { position: absolute; top: 0; bottom: 0; background: #fff; box-shadow: -30px 0 60px rgba(0,0,0,.12); }
  .overlay { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  #veil { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(255,255,255,.62), rgba(244,244,246,.5)); opacity: 0; }
  #end { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: flex; align-items: center; justify-content: center; gap: 30px; opacity: 0; }
  .logoface { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 30px; }
  .logoface svg { width: 150px; height: 150px; overflow: visible; }
  .logoface svg path { transform-box: fill-box; transform-origin: 50% 50%; opacity: 0; }
  .logoface span { font: 600 168px/1 Geist, sans-serif; color: #09090b; letter-spacing: -.045em; margin-top: -10px; opacity: 0; padding-right: 6px; }
  #end svg { width: 150px; height: 150px; overflow: visible; }
  #end svg path { transform-box: fill-box; transform-origin: 50% 50%; }
  #end span { font: 600 168px/1 Geist, sans-serif; color: #09090b; letter-spacing: -.045em; margin-top: -10px; }
  #logo { position: absolute; left: 50%; top: 50%; width: 200px; height: 200px; margin: -100px 0 0 -100px; overflow: visible; }
  #logo path { transform-box: fill-box; transform-origin: 50% 50%; }
</style>
</head>
<body>
<div id="frame">
  <div id="noise"></div>
  <div id="floor"></div>
  <div id="stage">
    <div id="card">
      <div id="screen"></div>
      <div id="glass"></div>
      <div id="sheen"><i></i><b></b></div>
    </div>
  </div>
</div>
<script>
const IMG = 'IMGDIR/';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  out: x => 1 - Math.pow(1 - x, 3),
  out5: x => 1 - Math.pow(1 - x, 5),
  in: x => x * x * x,
  inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  inOut5: x => x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2,
  back: x => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  sine: x => (1 - Math.cos(Math.PI * x)) / 2,
};
const $ = (tag, cls, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; if (parent) parent.append(e); return e; };
const SVGNS = 'http://www.w3.org/2000/svg';
const S = (tag, attrs, parent) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.append(e); return e; };
const xf = (el, { x = 0, y = 0, s = 1, rx = 0, ry = 0 } = {}) =>
  el.style.transform = `translate3d(${x}px,${y}px,0) rotateX(${rx}deg) rotateY(${ry}deg) scale(${s})`;

const card = document.getElementById('card'), screen = document.getElementById('screen');
const sheen = document.getElementById('sheen'), floor = document.getElementById('floor');
const RW = 1560, K = RW / 1400, PAD = 12;   // screen width, px per preview unit, glass bezel
const BOTTOM = 908;                           // card bottom edge (just above the reflection line)
let building = null;                          // page being built (layers report their height to it)

// One screenshot, laid out in 1400-wide preview units; the card is sized to it.
function layer(rig, file, ph) {
  const el = $('div', 'layer', rig);
  const H = ph * K;
  if (building && !building.h) building.h = H;
  const base = $('div', 'base', el);
  Object.assign(base.style, { height: H + 'px', backgroundImage: `url(${IMG}${file})`, backgroundSize: `${RW}px ${H}px` });
  const L = { el, base, file, ph, H, items: [], wv: null, hole: null, fill: null, fillAt: Infinity };
  L.slice = (x, y, w, h, rad) => {
    const s = $('div', 'slice', el);
    Object.assign(s.style, { left: x * K + 'px', top: y * K + 'px', width: w * K + 'px', height: h * K + 'px',
      backgroundImage: `url(${IMG}${file})`, backgroundSize: `${RW}px ${H}px`, backgroundPosition: `${-x * K}px ${-y * K}px` });
    if (rad != null) s.style.borderRadius = rad + 'px';
    return s;
  };
  L.box = ([x, y, w, h]) => {
    const b = $('div', 'box', el);
    Object.assign(b.style, { left: x * K + 'px', top: y * K + 'px', width: w * K + 'px', height: h * K + 'px' });
    return b;
  };
  // spec: [kind, t, [x,y,w,h], opts]
  L.add = specs => specs.forEach(([kind, t, r, o = {}]) => {
    const box = o.box ? L.box(r) : null;
    const el = L.slice(...r, o.rad);
    if (kind === 'flip') el.style.transformOrigin = '50% 0%';
    L.items.push({ kind, t, r, d: o.d ?? 0.7, el, box, focus: !!o.focus });
  });
  // One continuous build: a wave runs top→bottom (leaning left→right) over `dur`; each element enters as the
  // wave reaches it and the full screenshot fills in `lag` behind the front.
  L.wave = (t0, dur, lag = 0.45) => {
    L.wv = { t0, dur, lag };
    for (const it of L.items) if (!it.focus) it.t = t0 + (it.r[1] / ph) * dur + (it.r[0] / 1400) * 0.25;
  };
  L.waveAt = (x, y) => L.wv.t0 + (y / ph) * L.wv.dur + (x / 1400) * 0.25;
  // Zoom target: focus items stay out of the build (a hole is cut in the screenshot over them) and animate once
  // the camera has pushed in; the hole fills back in after they land.
  L.focus = (tF, span = 0.8, extra = []) => {
    const f = L.items.filter(it => it.focus);
    const rs = [...f.map(it => it.r), ...extra];
    const x0 = Math.min(...rs.map(r => r[0])), y0 = Math.min(...rs.map(r => r[1]));
    const x1 = Math.max(...rs.map(r => r[0] + r[2])), y1 = Math.max(...rs.map(r => r[1] + r[3]));
    for (const it of f) it.t = tF + ((it.r[1] - y0) / (y1 - y0 || 1)) * span * 0.6 + ((it.r[0] - x0) / (x1 - x0 || 1)) * span * 0.4;
    L.fillAt = Math.max(...f.map(it => it.t + it.d));
    L.hole = [x0, y0, x1 - x0, y1 - y0];
    L.fill = L.slice(...L.hole, 0);
    L.base.after(L.fill);
    const [hx, hy, hw, hh] = L.hole.map(v => v * K);
    L.base.style.clipPath = `path(evenodd, 'M0 0H${RW}V${H}H0Z M${hx} ${hy}h${hw}v${hh}h${-hw}Z')`;
    return tF;
  };
  L.render = (u, baseAt) => {
    for (const it of L.items) {
      const { kind, t, d, el, box } = it;
      const q = P(u, t, t + d), e = E.out5(q), vis = u >= t;
      if (box) {
        const bq = E.out5(P(u, t - 0.28, t + 0.25));
        box.style.opacity = bq; box.style.transform = `scale(${lerp(0.94, 1, bq)})`;
      }
      el.style.opacity = vis ? 1 : 0;
      el.style.clipPath = ''; el.style.webkitMaskImage = '';
      switch (kind) {
        case 'fade': el.style.opacity = E.out(q); xf(el); break;
        case 'pop': el.style.opacity = P(u, t, t + d * 0.35); xf(el, { y: (1 - e) * 26, s: lerp(0.95, 1, e) }); break;
        case 'scale': { const b = E.back(q); el.style.opacity = P(u, t, t + 0.12); xf(el, { s: lerp(0.3, 1, b) }); break; }
        case 'flip': el.style.opacity = P(u, t, t + 0.18); xf(el, { rx: -82 * (1 - e) }); break;
        case 'card': { const b = E.back(q); el.style.opacity = P(u, t, t + 0.15); xf(el, { rx: 70 * (1 - b), y: 40 * (1 - b), s: lerp(0.86, 1, b) }); break; }
        case 'slideL': el.style.opacity = P(u, t, t + d * 0.4); xf(el, { x: -50 * (1 - e) }); break;
        case 'slideR': el.style.opacity = P(u, t, t + d * 0.4); xf(el, { x: 70 * (1 - e) }); break;
        case 'slideU': el.style.opacity = P(u, t, t + d * 0.4); xf(el, { y: 22 * (1 - e) }); break;
        case 'slideD': el.style.opacity = P(u, t, t + d * 0.4); xf(el, { y: -30 * (1 - e) }); break;
        case 'wipeL': el.style.clipPath = `inset(0 ${(1 - E.inOut(q)) * 100}% 0 0)`; xf(el); break;
        case 'wipeU': el.style.clipPath = `inset(${(1 - E.inOut(q)) * 100}% 0 0 0)`; xf(el); break;
        case 'wipeD': el.style.clipPath = `inset(0 0 ${(1 - E.inOut(q)) * 100}% 0)`; xf(el); break;
        case 'conic': {
          const a = 360 * E.inOut(q);
          el.style.webkitMaskImage = `conic-gradient(from 0deg, #000 ${a}deg, transparent ${a + 0.5}deg)`;
          xf(el, { s: lerp(0.85, 1, E.out5(q)) }); break;
        }
      }
    }
    if (L.fill) L.fill.style.opacity = E.out(P(u, L.fillAt - 0.1, L.fillAt + 0.35));
    // the full screenshot fills in behind the wave front (or, without a wave, settles in with a sweep at baseAt)
    const bq = L.wv ? P(u, L.wv.t0 + L.wv.lag, L.wv.t0 + L.wv.lag + L.wv.dur) : E.inOut(P(u, baseAt, baseAt + 0.7));
    L.base.style.opacity = bq > 0 ? 1 : 0;
    const edge = lerp(-18, 100, bq);
    L.base.style.webkitMaskImage = bq >= 1 ? '' : `linear-gradient(180deg, #000 ${edge}%, transparent ${edge + 18}%)`;
  };
  return L;
}

// =====================================================================
// pages
// =====================================================================
const pages = [];
const page = (life, axis, build, zoom) => {
  const el = $('div', 'pg', screen);
  const p = { el, life, axis, w: RW, h: 0, zoom };
  building = p;
  p.render = build ? build(el) : () => {};
  building = null;
  pages.push(p);
};
const rows = (n, x, y0, pitch, w, h, t0, dt, kind = 'slideU') =>
  Array.from({ length: n }, (_, i) => [kind, t0 + i * dt, [x, y0 + i * pitch, w, h ?? pitch], { rad: 0, d: 0.55 }]);

// helpers for the live (zoomed) moments — all geometry in preview units
const px = v => v * K + 'px';
const div = (parent, css = {}, html) => { const e = $('div', '', parent); Object.assign(e.style, { position: 'absolute' }, css); if (html != null) e.innerHTML = html; return e; };
const box = (parent, [x, y, w, h], css = {}) => div(parent, { left: px(x), top: px(y), width: px(w), height: px(h), ...css });
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, x) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], x))).join(',')})`; };
const FONT = 'Geist, sans-serif';

// 01 — Home dashboard
page(5.1, 'y', rig => {
  const L = layer(rig, '01-shift-dashboard.webp', 706.3);
  L.add([
    ['slideD', 0.15, [0, 0, 1400, 38], { rad: 0 }],
    ['fade', 0.3, [0, 44, 1046, 60], { rad: 0 }],
    ['slideR', 0.35, [1050, 40, 350, 666], { rad: 0, d: 0.8 }],
    ...[13, 271, 528, 786].map((x, i) => ['pop', 0.45 + i * 0.07, [x, 108, 251, 60], { box: true }]),
    ['fade', 0.75, [13, 178, 508, 44], { box: true }],
    ['scale', 0.95, [23, 222, 94, 72], { rad: 3 }],
    ['scale', 1.02, [23, 296, 94, 35], { rad: 3 }],
    ['scale', 1.07, [119, 222, 83, 54], { rad: 3 }],
    ['scale', 1.12, [119, 278, 83, 53], { rad: 3 }],
    ['scale', 1.17, [204, 222, 157, 41], { rad: 3 }],
    ['scale', 1.22, [204, 265, 157, 66], { rad: 3 }],
    ['scale', 1.27, [363, 222, 94, 109], { rad: 3 }],
    ['scale', 1.32, [459, 222, 52, 109], { rad: 3 }],
    ['fade', 0.82, [528, 178, 509, 44], { box: true }],
    ...[[588, 640], [655, 727], [750, 822], [845, 917], [942, 1012]].map(([a, b], i) => ['wipeU', 1.0 + i * 0.08, [a, 226, b - a, 93], { rad: 0, d: 0.65 }]),
    ['fade', 1.3, [540, 318, 490, 18], { rad: 0 }],
    ['pop', 1.0, [1063, 109, 323, 245], {}],
    ['fade', 1.15, [0, 388, 1046, 22], { rad: 0 }],
    ...[13, 271, 528, 786].map((x, i) => ['pop', 1.2 + i * 0.07, [x, 413, 251, 60], { box: true }]),
    ['fade', 1.4, [13, 483, 508, 44], { box: true }],
    ...rows(5, 20, 526, 22.2, 498, 22, 1.5, 0.07, 'slideL'),
    ['fade', 1.45, [528, 483, 509, 44], { box: true }],
    ['wipeL', 1.6, [536, 525, 495, 115], { rad: 0, d: 1.1 }],
  ]);
  L.wave(0, 1.5);
  // live: two pairs re-split together — Administrator (red) grows down into Financial Data (orange), and
  // Customer Data (yellow) widens into Sensitive Data (orange); the vendor counts tick over
  const GAP = 3, TOP = 222.6, BOT = 329.6;
  const live = div(L.el, { inset: 0, opacity: 0 });
  box(live, [119.6, TOP, 82.1, BOT - TOP], { background: '#fff' });
  box(live, [363.6, TOP, 147, BOT - TOP], { background: '#fff' });
  const tile = (bg, title) => {
    const t = div(live, { background: bg, borderRadius: px(2.9), overflow: 'hidden' });
    div(t, { left: px(7.8), bottom: px(14.4), font: `600 ${px(6.3)}/1 ${FONT}`, color: '#fff', whiteSpace: 'nowrap' }, title);
    const sub = div(t, { left: px(7.8), bottom: px(5.9), font: `400 ${px(5.7)}/1 ${FONT}`, color: 'rgba(255,255,255,.9)', whiteSpace: 'nowrap' });
    return { t, sub, at: ([x, y, w, h]) => Object.assign(t.style, { left: px(x), top: px(y), width: px(w), height: px(h) }) };
  };
  const adm = tile('#dd514b', 'Administrator'), fin = tile('#ec964f', 'Financial Data');
  const sen = tile('#ec964f', 'Sensitive Data'), cus = tile('#debb3d', 'Customer Data');
  let tL = Infinity;
  building.onFocus = tF => { tL = tF + 0.3; };
  return u => {
    L.render(u);
    live.style.opacity = P(u, tL - 0.15, tL);
    const k1 = E.inOut(P(u, tL + 0.1, tL + 1.5)), k2 = E.inOut(P(u, tL + 0.3, tL + 1.7));
    const n = (a, b, k) => Math.round(lerp(a, b, k));
    const y = lerp(275.1, 296, k1);
    adm.at([119.6, TOP, 82.1, y - TOP]); fin.at([119.6, y + GAP, 82.1, BOT - y - GAP]);
    const x = lerp(457.0, 430, k2);
    sen.at([363.6, TOP, x - 363.6, BOT - TOP]); cus.at([x + 2.5, TOP, 510.4 - x - 2.5, BOT - TOP]);
    adm.sub.textContent = `${n(4, 6, k1)} vendors (${n(9, 13, k1)}%)`;
    fin.sub.textContent = `${n(4, 2, k1)} vendors (${n(9, 4, k1)}%)`;
    sen.sub.textContent = `${n(9, 6, k2)} vendors (${n(20, 13, k2)}%)`;
    cus.sub.textContent = `${n(5, 8, k2)} vendors (${n(11, 17, k2)}%)`;
    const g1 = Math.sin(Math.PI * k1), g2 = Math.sin(Math.PI * k2);
    adm.t.style.filter = `brightness(${1 + 0.1 * g1})`; cus.t.style.filter = `brightness(${1 + 0.1 * g2})`;
  };
}, { at: [315, 276], s: 2.2, from: 2.0 });

// 02 — Vendors table, then 03 — the vendor card drawer slides over it
page(8.1, 'x', rig => {
  const A = layer(rig, '02-inventory-vendors-page.webp', 701.5);
  A.add([
    ['slideD', 0.15, [0, 0, 1400, 38], { rad: 0 }],
    ['fade', 0.3, [0, 55, 1400, 30], { rad: 0 }],
    ...[[13, 335], [357, 335], [701, 334], [1044, 335]].map(([x, w], i) => ['fade', 0.4 + i * 0.07, [x, 87, w, 22], { box: true }]),
    ['conic', 0.65, [19, 111, 70, 70], { rad: 35, d: 0.9 }],
    ['slideL', 0.85, [95, 134, 250, 24], { rad: 0 }],
    ...[0, 1, 2, 3, 4].map(i => ['wipeL', 0.75 + i * 0.06, [368, 116 + i * 9.4, 320, 9.4], { rad: 0, d: 0.7 }]),
    ['fade', 1.05, [365, 163, 320, 16], { rad: 0 }],
    ['conic', 0.8, [706, 111, 70, 70], { rad: 35, d: 0.9 }],
    ['slideL', 1.0, [780, 134, 215, 24], { rad: 0 }],
    ...[[1072, 1112], [1134, 1173], [1195, 1234], [1256, 1296], [1317, 1356]].map(([a, b], i) => ['wipeU', 0.85 + i * 0.07, [a, 115, b - a, 50], { rad: 0, d: 0.6 }]),
    ['fade', 1.15, [1050, 165, 325, 16], { rad: 0 }],
    ['fade', 1.0, [0, 191, 1400, 26], { rad: 0 }],
    ['wipeL', 1.1, [13, 222, 1366, 23], { rad: 0, d: 0.7 }],
    ...rows(13, 13, 245, 32.6, 1366, 32.6, 1.2, 0.045),
    ['fade', 1.85, [0, 666, 1400, 30], { rad: 0 }],
  ]);
  const patch = $('div', '', A.el);
  Object.assign(patch.style, { position: 'absolute', background: '#fff', left: 1388 * K + 'px', top: 160 * K + 'px', width: 12 * K + 'px', height: 96 * K + 'px' });
  const scrim = $('div', 'scrim', A.el);

  const B = layer(rig, '03-inventory-vendors-card.png', 704.6);
  const left = B.slice(0, 0, 350, 704.6, 0);
  const drawer = $('div', 'drawer', B.el);
  Object.assign(drawer.style, { left: 350 * K + 'px', width: 1050 * K + 'px' });
  const DT = 3.3;
  const DC = DT - 0.55;  // content rides in with the panel
  B.add([
    ['fade', DC + 0.45, [350, 0, 1050, 70], { rad: 0 }],
    ['slideL', DC + 0.55, [368, 82, 470, 26], { rad: 0 }],
    ['fade', DC + 0.62, [372, 122, 738, 40], { box: true }],

for (const p of pages) { p.start = acc; acc += p.life + FLIP; }
// zoom targets start animating just before the push-in lands
pages.forEach(p => p.onFocus && p.onFocus((p.life - HOLD - 0.25 * ZL) * REVEAL + LEAD));
const EXIT = fin.start + fin.life, END = EXIT + INTRO;
const DURATION = END / SPEED;
window.DURATION = DURATION;

const size = p => ({ W: p.w + 2 * PAD, H: p.h + 2 * PAD });
const sheenI = sheen.children[0], sheenB = sheen.children[1];

// push toward the element, hold (slowly creeping in), then release the zoom as the card flips away
const zoomK = (p, u) => {
  if (!p.zoom) return 0;
  const zs = p.life - HOLD - ZL;
  return u < p.life ? E.inOut(P(u, zs, zs + ZL)) : 1 - E.inOut(P(u, p.life, p.life + 0.85 * FLIP));
};
// k=0 resting, k=1 element centred in frame at zoom.s (h: slow creep during the hold)
function zoomTo(p, k, h = 0) {
  if (!p.zoom || k <= 0) return { dx: 0, dy: 0, s: 1, ox: 0, oy: 0 };
  const { W, H } = size(p), S = (1 + (p.zoom.s - 1) * k) * (1 + 0.06 * h * k);
  const ox = PAD + p.zoom.at[0] * K - W / 2, oy = PAD + p.zoom.at[1] * K - H / 2;
  const cy = BOTTOM - H / 2;
  return { dx: lerp(ox, 0, k) - ox * S, dy: lerp(oy, 540 - cy, k) - oy * S, s: S, ox, oy };
}

function setCard({ W, H, RX, RY, z = 0, s = 1, dx = 0, dy = 0, px = 0, py = 0, op = 1, refl = 1, sweep = null, Z = 1 }) {
  // A face that will be zoomed into is laid out once at its peak size via CSS zoom (so it rasters at full
  // resolution — transform scale-ups just stretch a 1x bitmap). Z stays constant for the whole face, and the
  // motion itself is a transform scale down from it: no per-frame relayout, so nothing pixel-snaps or jitters.
  // Lengths below are in zoomed units.
  const r = s / Z;
  Object.assign(card.style, { zoom: Z, width: W + 'px', height: H + 'px', left: 960 / Z - W / 2 + 'px', top: (BOTTOM - H / 2) / Z - H / 2 + 'px', opacity: op,
    transform: `translate3d(${dx / Z}px,${dy / Z}px,${z / Z}px) translate(${px / Z}px,${py / Z}px) rotateX(${RX}deg) rotateY(${RY}deg) translate(${-px / Z}px,${-py / Z}px) scale(${r})` });
  stage.style.webkitBoxReflect = `below 0 linear-gradient(transparent 72%, rgba(0,0,0,${(0.16 * refl).toFixed(3)}))`;
  // the glass highlight slides with the card's rotation
  const pos = sweep ?? (0.26 + RY / 95 + RX / 260);
  sheenI.style.transform = `translateX(${pos * W - 0.17 * W}px) skewX(-18deg)`;
  sheenB.style.transform = `translateX(${(pos + 0.24) * W}px) skewX(-18deg)`;
  // floor shadow tracks the projected footprint
  const wx = Math.abs(Math.cos(RY * Math.PI / 180));
  floor.style.top = BOTTOM - 26 + 'px';
  floor.style.transform = `scale(${(W / 1600) * Math.min(s, 1.2) * Math.max(wx, 0.06)}, ${0.8 + 0.2 * Math.abs(Math.cos(RX * Math.PI / 180))})`;
  floor.style.opacity = op * refl * (0.6 + 0.4 * wx) * (1 - Math.min(1, Math.abs(z) / 1400) * 0.85);
}

window.render = t => {
  const T = t * SPEED;
  pages.forEach(p => p.el.style.display = 'none');
  let i = 0;
  while (i < pages.length - 1 && T >= pages[i + 1].start) i++;
  const p = pages[i], next = pages[i + 1], u = T - p.start;
  const zk = next ? zoomK(p, u) : 0;
  const zt = zoomTo(p, zk, p.zoom ? E.sine(P(u, p.life - HOLD, p.life)) : 0), calm = 1 - 0.65 * zk;
  const pw = clamp(zk * 1.6);  // pivot drifts onto the element as the push builds
  const c = { dx: zt.dx, dy: zt.dy, refl: 1 - zk };
  // zoom.s × hold creep, ×0.7: with the 2× render that still rasters above output resolution at the peak,
  // while keeping layers under Chrome's size limits (bigger faces lose tiles)
  // (the ?play preview is shown scaled down, so it skips this: big 3D layers on a 2x display drop GPU tiles → flicker)
  const peakZ = f => f && f.zoom && !PREVIEW ? Math.max(1, f.zoom.s * 1.06 * 0.7) : 1;
  if (!next || u < p.life) {
    p.el.style.display = 'block'; p.render(u * REVEAL + LEAD);
    const ps = p.pose(Math.max(u, 0));
    Object.assign(c, size(p), { RX: ps.rx * calm, RY: ps.ry * calm, s: zt.s, Z: peakZ(p) });
  } else {
    // flip 0→180 around this page's axis; past 90° the next face takes over and the card reshapes to it
    const fq = P(u, p.life, p.life + FLIP), q = (p.zoom ? E.inOut : E.inOut5)(fq), ang = 180 * q, lift = Math.sin(Math.PI * q);
    const p0 = p.pose(p.life), p1 = next.pose(0);
    let RX = lerp(p0.rx, p1.rx, q) * calm, RY = lerp(p0.ry, p1.ry, q) * calm, W, H;
    let a;
    if (ang < 90) { p.el.style.display = 'block'; p.render(u * REVEAL + LEAD); ({ W, H } = size(p)); a = ang; c.Z = peakZ(p); }
    else {
      next.el.style.display = 'block'; next.render((u - p.life - FLIP) * REVEAL + LEAD);
      const m = E.inOut(P(ang, 90, 180)), A = size(p), B = size(next);
      W = lerp(A.W, B.W, m); H = lerp(A.H, B.H, m); a = ang - 180; c.Z = peakZ(next);
    }
    const axis = next.final ? 'y' : p.axis;
    if (axis === 'x') RX += a; else RY += a;
    // zoomed flips stay closer to camera: the push replaces the dip
    const dip = 1 - zk * 0.85;
    Object.assign(c, { W, H, RX, RY, s: (1 - 0.1 * lift * dip) * zt.s, z: -220 * lift * dip, ang, axis });
  }
  c.px = zt.ox * c.s * pw; c.py = zt.oy * c.s * pw;
  // the card tumbles in from behind the camera, and at the end flips back out the same way —
  // the last frame meets the first, so the video loops
  const p0 = pose(0), from = { RX: p0.rx + 180, RY: p0.ry - 24, z: 1900, dy: -120 };
  if (T < INTRO) {
    const r = 1 - E.out(P(T, 0, INTRO));
    c.RX = lerp(c.RX, from.RX, r); c.RY = lerp(c.RY, from.RY, r); c.z = from.z * r; c.dy = from.dy * r;
  } else if (T > EXIT) {
    const q = E.in(P(T, EXIT, END));
    c.RX = lerp(c.RX, from.RX - 360, q); c.RY = lerp(c.RY, from.RY, q); c.z = from.z * q; c.dy = from.dy * q;
  }
  // when the card shows its back (intro / outro tumbles), the back is blank glass
  const rad = Math.PI / 180;
  if (Math.cos(c.RX * rad) * Math.cos(c.RY * rad) < 0) pages.forEach(p => p.el.style.display = 'none');
  window.cardState = c;  // read by blender/export.mjs
  setCard(c);
};

window.ready = (async () => {
  const files = ['01-shift-dashboard.webp', '02-inventory-vendors-page.webp', '03-inventory-vendors-card.png', '04-vendor-access-graph.webp', '05-threat-center.webp', '06-integrations-grid.jpg', '07-assessment-flow-1.webp'];
  await Promise.all(files.map(f => { const i = new Image(); i.src = IMG + f; return i.decode(); }));
  await Promise.all(['400', '500', '600'].map(w => document.fonts.load(`${w} 100px Geist`)));
  window.render(parseFloat(new URLSearchParams(location.search).get('t') || '0'));
  return true;
})();

// beats in video seconds — for review (?play) and storyboard notes
const NAMES = ['01 Dashboard', '02 Vendors → vendor card', '04 Access graph', '05 Threat center', '06 Integrations', '07 Assessment', 'End: Shift mark'];
window.BEATS = pages.map((p, i) => ({
  name: NAMES[i], start: +(p.start / SPEED).toFixed(2),
  zoomIn: p.zoom ? +((p.start + p.life - HOLD - ZL) / SPEED).toFixed(2) : null,
  flip: i < pages.length - 1 ? +((p.start + p.life) / SPEED).toFixed(2) : null,
}));

// ?play — review player: fits the 1920×1080 frame to the window, play/pause (space), scrub, beat markers, ←/→ step a frame
if (new URLSearchParams(location.search).has('play')) window.ready.then(() => {
  const fr = document.getElementById('frame');
  document.documentElement.style.cssText = document.body.style.cssText = 'width:100%;height:100%;overflow:hidden;background:#1b1b1f';
  const bar = $('div', '', document.body);
  bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;height:64px;padding:8px 16px;font:12px/1.2 ui-monospace,monospace;color:#ddd;background:#111;z-index:9;user-select:none';
  bar.innerHTML = '<div style="display:flex;gap:12px;align-items:center;height:20px"><button id="pp" style="font:inherit;width:64px">pause</button><span id="tc"></span><span id="bt" style="color:#9cf"></span></div><div id="tl" style="position:relative;height:24px;margin-top:6px;background:#222;cursor:pointer"><div id="hd" style="position:absolute;top:0;bottom:0;width:2px;background:#fff"></div></div>';
  const tl = bar.querySelector('#tl'), hd = bar.querySelector('#hd'), tc = bar.querySelector('#tc'), bt = bar.querySelector('#bt'), pp = bar.querySelector('#pp');
  const X = s => (s / DURATION * 100) + '%';
  for (const b of BEATS) {
    const m = $('div', '', tl);
    m.style.cssText = `position:absolute;top:0;bottom:0;left:${X(b.start)};border-left:1px solid #9cf;padding-left:3px;color:#9cf;font-size:10px;white-space:nowrap;overflow:hidden`;
    m.textContent = b.name.split(' ')[0];
    if (b.zoomIn) { const z = $('div', '', tl); z.style.cssText = `position:absolute;bottom:0;height:5px;left:${X(b.zoomIn)};width:${X(b.flip - b.zoomIn)};background:#c96`; }
  }
  const fit = () => {
    const k = Math.min(innerWidth / 1920, (innerHeight - 64) / 1080);
    fr.style.cssText = `width:1920px;height:1080px;transform-origin:0 0;transform:translate(${(innerWidth - 1920 * k) / 2}px,0) scale(${k})`;
  };
  fit(); addEventListener('resize', fit);
  let t = 0, playing = true, last = performance.now();
  const show = () => {
    window.render(t);
    hd.style.left = X(t);
    const b = [...BEATS].reverse().find(b => t >= b.start) || BEATS[0];
    tc.textContent = `${t.toFixed(2)}s / ${DURATION.toFixed(1)}s  ·  f${Math.round(t * 30)}`;
    bt.textContent = b.name;
    pp.textContent = playing ? 'pause' : 'play';
  };
  const loop = now => { if (playing) { t = (t + (now - last) / 1000) % DURATION; show(); } last = now; requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  const seek = e => { const r = tl.getBoundingClientRect(); t = clamp((e.clientX - r.left) / r.width) * DURATION; show(); };
  tl.addEventListener('pointerdown', e => { seek(e); tl.setPointerCapture(e.pointerId); tl.onpointermove = seek; });
  tl.addEventListener('pointerup', () => { tl.onpointermove = null; });
  pp.onclick = () => { playing = !playing; show(); };
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing = !playing; }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { playing = false; t = clamp(t + (e.code === 'ArrowRight' ? 1 : -1) / 30, 0, DURATION); }
    show();
  });
});
</script>
</body>
</html>
