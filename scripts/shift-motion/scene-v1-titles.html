<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Geist; font-weight: 400; src: url(FONTDIR/geist-sans-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: Geist; font-weight: 500; src: url(FONTDIR/geist-sans-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: Geist; font-weight: 600; src: url(FONTDIR/geist-sans-latin-600-normal.woff2) format('woff2'); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #10121a; }
  body { font-family: Geist, sans-serif; -webkit-font-smoothing: antialiased; }
  #frame { position: absolute; inset: 0; overflow: hidden; background: #10121a; }
  .bgglow { position: absolute; inset: -200px; pointer-events: none;
    background:
      radial-gradient(900px 700px at 92% 4%, rgba(201,128,92,.38), transparent 60%),
      radial-gradient(900px 700px at 4% 100%, rgba(72,72,170,.40), transparent 60%); }
  .dots { position: absolute; inset: 0; opacity: .5;
    background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.2px); background-size: 32px 32px; }
  .scene { position: absolute; inset: 0; perspective: 2600px; display: none; }
  .screen { position: absolute; perspective: 1800px; transform-origin: 50% 50%; will-change: transform; }
  .paper { position: absolute; inset: 0; background: #fff; border-radius: 16px;
    box-shadow: 0 60px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06); }
  .base, .slice { position: absolute; background-repeat: no-repeat; }
  .base { inset: 0; border-radius: 16px; }
  .dim { position: absolute; inset: 0; border-radius: 16px; background: #0d0f17; opacity: 0; }
  .slice { border-radius: 7px; transform-origin: 50% 50%; will-change: transform, opacity; }
  .overlay { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  .caption { position: absolute; left: 180px; top: 62px; color: #e9e9ec; }
  .eyebrow { font-size: 15px; letter-spacing: .18em; text-transform: uppercase; color: #f2a65a; font-weight: 500; margin-bottom: 14px; display: flex; gap: 14px; align-items: center; }
  .eyebrow i { display: block; height: 1px; width: 0; background: #f2a65a; }
  .headline { font-size: 46px; font-weight: 500; letter-spacing: -.025em; line-height: 1.1; white-space: nowrap; }
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 6px; margin-bottom: -6px; }
  .w > span { display: inline-block; will-change: transform; }
  #band { position: absolute; top: -100px; height: 1280px; width: 2400px; left: -3000px; transform: skewX(-14deg); z-index: 50;
    background: linear-gradient(90deg, #2b2e7a 0%, #6b5a8e 30%, #d58a5c 62%, #f7b24c 100%); }
  #band2 { position: absolute; top: -100px; height: 1280px; width: 2400px; left: -3000px; transform: skewX(-14deg); z-index: 51; background: #10121a; }
  .cursor { position: absolute; width: 30px; height: 30px; left: 0; top: 0; opacity: 0; filter: drop-shadow(0 4px 8px rgba(0,0,0,.35)); }
  .chip { position: absolute; padding: 10px 16px 10px 14px; border-radius: 999px; background: #12141d; color: #f1f1f3;
    font-size: 17px; font-weight: 500; display: flex; align-items: center; gap: 10px; white-space: nowrap; opacity: 0;
    box-shadow: 0 16px 40px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.08); }
  .chip b { width: 9px; height: 9px; border-radius: 50%; background: #f7a64c; box-shadow: 0 0 12px #f7a64c; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 60; }
</style>
</head>
<body>
<div id="frame">
  <div class="bgglow" id="glow"></div>
  <div class="dots"></div>
  <div id="scenes"></div>
  <div id="band2"></div>
  <div id="band"></div>
  <div id="fade"></div>
</div>
<script>
const IMG = 'IMGDIR/';
const LOGO_PATHS = [
  'M10.6474 0.0655084C10.805 -0.0218415 10.9994 -0.0218358 11.157 0.0655233L17.5492 3.60817C17.7924 3.74293 17.8754 4.0409 17.7347 4.27372C17.5939 4.50653 17.2827 4.58603 17.0396 4.45127L10.9021 1.04984L5.01771 4.31059V10.8333L11.157 14.2352C11.4001 14.37 11.4832 14.6679 11.3424 14.9008C11.2017 15.1336 10.8905 15.2131 10.6474 15.0784L4.2542 11.5357C4.09707 11.4486 4.00031 11.288 4.00031 11.1142V4.02972C4.00031 3.85589 4.09707 3.69523 4.2542 3.60816L10.6474 0.0655084Z',
  'M4.06847 3.78527C4.20917 3.55243 4.52037 3.47289 4.76354 3.60761L11.1567 7.1494C11.3999 7.28412 11.4829 7.58208 11.3422 7.81492C11.2015 8.04775 10.8903 8.1273 10.6472 7.99258L4.25402 4.45079C4.01085 4.31607 3.92777 4.01811 4.06847 3.78527Z',
  'M10.9019 7.57167V14.6561L17.2942 4.02989L10.9019 7.57167Z',
  'M17.6535 3.68513C17.8165 3.84085 17.8496 4.08269 17.7347 4.27372L11.3427 14.8992C11.2278 15.0903 10.993 15.1836 10.7705 15.1266C10.548 15.0697 10.3932 14.8766 10.3932 14.6561V7.57167C10.3932 7.39783 10.49 7.23717 10.6471 7.1501L17.0394 3.60831C17.2387 3.4979 17.4905 3.5294 17.6535 3.68513ZM11.4106 7.85256V12.8346L15.9059 5.36185L11.4106 7.85256Z',
  'M10.902 14.1692C11.1829 14.1692 11.4107 14.3873 11.4107 14.6563C11.4107 14.7548 11.3801 14.8474 11.3275 14.9241L8.14574 20.2133C8.00552 20.4464 7.69449 20.5266 7.45104 20.3923C7.20759 20.258 7.1239 19.9602 7.26413 19.7271L10.4603 14.414C10.4836 14.3752 10.5121 14.3402 10.5446 14.3096C10.6365 14.2228 10.7627 14.1692 10.902 14.1692Z',
  'M13.6578 9.09925C13.7985 8.86643 14.1097 8.78692 14.3529 8.92166L20.746 12.4643C20.9892 12.5991 21.0722 12.897 20.9315 13.1298C20.7908 13.3627 20.4796 13.4422 20.2364 13.3074L13.8433 9.76479C13.6001 9.63005 13.5171 9.33208 13.6578 9.09925Z',
  'M7.26413 19.7271C7.40485 19.4943 7.71657 19.4139 7.95974 19.5486L14.3529 23.0913C14.596 23.226 14.6791 23.524 14.5384 23.7568C14.3976 23.9896 14.0864 24.0692 13.8433 23.9344L7.45104 20.3923C7.20759 20.258 7.1239 19.9602 7.26413 19.7271Z',
  'M14.0981 23.5124L20.4912 19.9697V12.8853L14.0981 23.5124Z',
  'M20.6226 12.4148C20.8452 12.4717 20.9999 12.6648 20.9999 12.8853V19.9697C20.9999 20.1436 20.9032 20.3042 20.746 20.3913L14.3529 23.9339C14.1536 24.0444 13.9017 24.0129 13.7387 23.8571C13.5758 23.7014 13.5424 23.4603 13.6573 23.2693L20.0504 12.6422C20.1654 12.4511 20.4001 12.3578 20.6226 12.4148ZM15.4866 22.1802L19.9825 19.6889V14.7067L15.4866 22.1802Z',
];
const logoSvg = (size, color) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24">${LOGO_PATHS.map(d => `<path fill-rule="evenodd" d="${d}" fill="${color}"/>`).join('')}</svg>`;

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  out: x => 1 - Math.pow(1 - x, 3),
  out5: x => 1 - Math.pow(1 - x, 5),
  inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  in: x => x * x * x,
  back: x => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  sine: x => (1 - Math.cos(Math.PI * x)) / 2,
};

// ---------- dom helpers ----------
const $ = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.append(e); return e; };
const SVGNS = 'http://www.w3.org/2000/svg';
const S = (tag, attrs, parent) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.append(e); return e; };

function xf(el, o = {}) {
  const { x = 0, y = 0, z = 0, s = 1, sx = 1, sy = 1, rx = 0, ry = 0, rz = 0, op } = o;
  el.style.transform = `translate3d(${x}px,${y}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s * sx},${s * sy})`;
  if (op != null) el.style.opacity = op;
}

// A screenshot laid out in 1400px-wide "preview space", rendered at k px per unit.
function makeScreen(parent, file, ph, width, cx, cy) {
  const k = width / 1400, W = width, H = ph * k;
  const el = $('div', 'screen', parent);
  Object.assign(el.style, { width: W + 'px', height: H + 'px', left: cx - W / 2 + 'px', top: cy - H / 2 + 'px' });
  const paper = $('div', 'paper', el);
  const base = $('div', 'base', el);
  Object.assign(base.style, { backgroundImage: `url(${IMG}${file})`, backgroundSize: `${W}px ${H}px` });
  const dim = $('div', 'dim', el);
  const overlay = S('svg', { class: 'overlay', viewBox: `0 0 1400 ${ph}`, width: W, height: H }, null);
  const scr = {
    el, paper, base, dim, overlay, k, W, H, ph, file,
    slice(x, y, w, h, r) {
      const s = $('div', 'slice', el);
      Object.assign(s.style, {
        left: x * k + 'px', top: y * k + 'px', width: w * k + 'px', height: h * k + 'px',
        backgroundImage: `url(${IMG}${file})`, backgroundSize: `${W}px ${H}px`, backgroundPosition: `${-x * k}px ${-y * k}px`,
      });
      if (r != null) s.style.borderRadius = r + 'px';
      s.r = [x, y, w, h];
      return s;
    },
    // camera: zoom s around focus point (preview coords), plus tilt/offset
    cam({ s = 1, fx = 700, fy = ph / 2, x = 0, y = 0, rx = 0, ry = 0, rz = 0, op } = {}) {
      const tx = -(fx - 700) * k * (s - 1) + x, ty = -(fy - ph / 2) * k * (s - 1) + y;
      xf(el, { x: tx, y: ty, s, rx, ry, rz, op });
    },
    pt(px, py) { return [px * k, py * k]; },
  };
  return scr;
}
const attachOverlay = scr => scr.el.append(scr.overlay);

function caption(parent, num, title) {
  const c = $('div', 'caption', parent);
  const eb = $('div', 'eyebrow', c, `<span>${num}</span><i></i>`);
  const h = $('div', 'headline', c);
  h.innerHTML = title.split(' ').map(w => `<span class="w"><span>${w}</span></span>`).join(' ');
  return { c, eb, line: eb.querySelector('i'), words: [...h.querySelectorAll('.w > span')] };
}
function renderCaption(cap, u, outAt) {
  const e = E.out5(P(u, 0.15, 0.9));
  cap.eb.style.opacity = e; cap.eb.style.transform = `translateY(${(1 - e) * 14}px)`;
  cap.line.style.width = E.out(P(u, 0.35, 1.2)) * 64 + 'px';
  cap.words.forEach((w, i) => {
    const q = E.out5(P(u, 0.3 + i * 0.055, 1.05 + i * 0.055));
    w.style.transform = `translateY(${(1 - q) * 110}%)`;
  });
  const o = 1 - E.inOut(P(u, outAt, outAt + 0.4));
  cap.c.style.opacity = o;
}

function lift(el, q, color = 'rgba(15,17,26,.28)', glow) {
  // q 0..1: how "picked up" the slice is
  const sh = `0 ${lerp(0, 26, q)}px ${lerp(0, 60, q)}px ${color}` + (glow ? `, 0 0 0 ${lerp(0, 2, q)}px ${glow}` : '');
  el.style.boxShadow = q > 0.001 ? sh : 'none';
}

const scenesEl = document.getElementById('scenes');
const scenes = [];
function scene(start, end, build) {
  const root = $('div', 'scene', scenesEl);
  const render = build(root);
  scenes.push({ start, end, root, render });
}

// =====================================================================
// 1. INTRO — the Shift brand panel, drawn line by line
// =====================================================================
scene(0, 4.2, root => {
  const f = 1.39, ox = 960 - 623 * f / 2, oy = 540 - 621 * f / 2;
  const svg = S('svg', { width: 623 * f, height: 621 * f, viewBox: '-2 -2 627 625', style: `position:absolute;left:${ox}px;top:${oy}px;overflow:visible` }, root);
  const defs = S('defs', {}, svg);
  defs.innerHTML = `
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9b44d"/><stop offset=".55" stop-color="#8f6f86"/><stop offset="1" stop-color="#2c3192"/>
    </linearGradient>
    <pattern id="hatch" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="22" height="22" fill="#151823"/><line x1="0" y1="0" x2="0" y2="22" stroke="#4a4f60" stroke-width="1.2"/>
    </pattern>
    <clipPath id="headClip"><rect x="0" y="120" width="449" height="266"/></clipPath>
    <clipPath id="hc1"><rect id="hc1r" x="258" y="0" width="0" height="120"/></clipPath>
    <clipPath id="hc2"><rect id="hc2r" x="258" y="386" width="191" height="0"/></clipPath>
    <clipPath id="circClip"><rect x="0" y="386" width="258" height="235"/></clipPath>
    <clipPath id="pillClip"><rect x="449" y="120" width="174" height="501"/></clipPath>`;
  S('rect', { x: 0, y: 0, width: 623, height: 621, fill: '#151823', id: 'panelBg' }, svg);
  const hatch1 = S('rect', { x: 258, y: 0, width: 365, height: 120, fill: 'url(#hatch)', 'clip-path': 'url(#hc1)' }, svg);
  const hatch2 = S('rect', { x: 258, y: 386, width: 191, height: 235, fill: 'url(#hatch)', 'clip-path': 'url(#hc2)' }, svg);
  const lines = [
    [0, 0, 623, 0], [623, 0, 623, 621], [623, 621, 0, 621], [0, 621, 0, 0],
    [0, 120, 623, 120], [258, 0, 258, 120], [449, 120, 449, 621], [0, 386, 449, 386], [258, 386, 258, 621],
  ].map(([x1, y1, x2, y2]) => {
    const len = Math.hypot(x2 - x1, y2 - y1);
    return S('line', { x1, y1, x2, y2, stroke: '#9aa0ad', 'stroke-width': 1.1, 'stroke-dasharray': len, 'stroke-dashoffset': len, 'data-len': len }, svg);
  });
  const logo = S('g', {}, svg);
  logo.innerHTML = `<g transform="translate(66,34) scale(2.15)">${LOGO_PATHS.map(d => `<path fill-rule="evenodd" d="${d}" fill="#d3d6d1"/>`).join('')}</g>
    <text x="114" y="74" font-family="Geist" font-weight="600" font-size="38" letter-spacing="-1" fill="#d3d6d1">Shift</text>`;
  const head = S('g', { 'clip-path': 'url(#headClip)' }, svg);
  const headLines = ['Shifting', 'Third Party', 'Security'].map((txt, i) => {
    const t = S('text', { x: 32, y: 200 + i * 66, 'font-family': 'Geist', 'font-weight': 400, 'font-size': 64, 'letter-spacing': -2.4, fill: '#d3d6d1' }, head);
    t.textContent = txt; return t;
  });
  const pillG = S('g', { 'clip-path': 'url(#pillClip)' }, svg);
  const pill = S('rect', { x: 502, y: 178, width: 68, height: 385, rx: 34, fill: 'url(#pill)' }, pillG);
  const knob = S('g', {}, svg);
  knob.innerHTML = `<circle cx="0" cy="0" r="34" fill="#d0d3cf"/><path d="M0 -15 V13 M-12 2 L0 14 L12 2" stroke="#151823" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  const circ = S('g', { 'clip-path': 'url(#circClip)' }, svg);
  const cA = S('circle', { cx: 106, cy: 503, r: 33, fill: '#d0d3cf' }, circ);
  const cB = S('circle', { cx: 151, cy: 503, r: 33, fill: '#d0d3cf' }, circ);
  const lens = S('path', { fill: '#151823' }, circ);

  return u => {
    lines.forEach((l, i) => {
      const q = E.inOut(P(u, 0.05 + i * 0.07, 0.75 + i * 0.07));
      l.setAttribute('stroke-dashoffset', (1 - q) * l.dataset.len);
    });
    document.getElementById('hc1r').setAttribute('width', 365 * E.inOut(P(u, 0.6, 1.3)));
    document.getElementById('hc2r').setAttribute('height', 235 * E.inOut(P(u, 0.7, 1.4)));
    const lq = E.out5(P(u, 0.75, 1.5));
    logo.setAttribute('opacity', lq); logo.setAttribute('transform', `translate(0,${(1 - lq) * 18})`);
    headLines.forEach((t, i) => { const q = E.out5(P(u, 0.95 + i * 0.13, 1.85 + i * 0.13)); t.setAttribute('transform', `translate(0,${(1 - q) * 80})`); });
    // pill grows up from the bottom of its cell
    const pq = E.inOut(P(u, 1.2, 2.3)), ph = 385 * pq;
    pill.setAttribute('y', 563 - ph); pill.setAttribute('height', Math.max(ph, 0.01));
    const kq = E.back(P(u, 2.05, 2.5)), bob = Math.sin(Math.max(0, u - 2.5) * 3.2) * 6 * P(u, 2.5, 2.9);
    knob.setAttribute('transform', `translate(536,529) translate(0,${bob}) scale(${kq})`);
    // circles slide together, the lens appears where they overlap
    const cq = E.out5(P(u, 1.5, 2.4));
    const ax = lerp(60, 106, cq), bx = lerp(197, 151, cq);
    cA.setAttribute('cx', ax); cB.setAttribute('cx', bx);
    const d = bx - ax;
    if (d < 66) {
      const mx = (ax + bx) / 2, hy = Math.sqrt(33 * 33 - (d / 2) * (d / 2));
      lens.setAttribute('d', `M${mx},${503 - hy} A33,33 0 0 1 ${mx},${503 + hy} A33,33 0 0 1 ${mx},${503 - hy}Z`);
    } else lens.setAttribute('d', '');
    const push = 1 + 0.07 * E.sine(P(u, 0.0, 4.2));
    svg.style.transform = `scale(${push}) rotate(${-1.2 * E.sine(P(u, 0, 4.2))}deg)`;
  };
});

// =====================================================================
// 2. DASHBOARD — the home view assembles from its parts
// =====================================================================
scene(4.2, 11.0, root => {
  const cap = caption(root, '01 — Overview', 'Every vendor, access path, and threat in one view.');
  const scr = makeScreen(root, '01-shift-dashboard.webp', 706.3, 1440, 960, 628);
  const nav = scr.slice(0, 0, 1400, 38, 0);
  const head1 = scr.slice(0, 44, 1046, 60, 0);
  const kpiX = [13, 271, 528, 786];
  const kpi1 = kpiX.map(x => scr.slice(x, 108, 251, 60));
  const tree = scr.slice(13, 178, 508, 163);
  const trend = scr.slice(528, 178, 509, 163);
  const ask = scr.slice(1050, 40, 350, 666, 0);
  const head2 = scr.slice(0, 390, 1046, 20, 0);
  const kpi2 = kpiX.map(x => scr.slice(x, 413, 251, 60));
  const recent = scr.slice(13, 483, 508, 163);
  const detect = scr.slice(528, 483, 509, 163);
  scr.el.append(scr.dim);
  const askCard = scr.slice(1063, 109, 323, 245);

  const pop = (el, u, a, dy = 50, rx = 40) => {
    const q = E.out5(P(u, a, a + 0.75));
    xf(el, { y: (1 - q) * dy, rx: (1 - q) * rx, s: lerp(.96, 1, q), op: P(u, a, a + 0.3) });
  };
  return u => {
    renderCaption(cap, u, 6.3);
    const pq = E.out5(P(u, 0, 0.9));
    scr.paper.style.opacity = pq;
    scr.base.style.opacity = P(u, 2.5, 2.9);
    xf(nav, { y: -30 * (1 - E.out(P(u, 0.25, 0.8))), op: P(u, 0.25, 0.6) });
    xf(head1, { x: -30 * (1 - E.out(P(u, 0.4, 1.0))), op: P(u, 0.4, 0.8) });
    kpi1.forEach((el, i) => pop(el, u, 0.5 + i * 0.08));
    // charts reveal with a wipe, the treemap left→right, the bars bottom→top
    const tw = E.inOut(P(u, 0.9, 1.75));
    tree.style.clipPath = `inset(0 ${(1 - tw) * 100}% 0 0 round 7px)`;
    const bw = E.inOut(P(u, 1.0, 1.85));
    trend.style.clipPath = `inset(${(1 - bw) * 100}% 0 0 0 round 7px)`;
    xf(ask, { x: 140 * (1 - E.out5(P(u, 1.05, 1.9))), op: P(u, 1.05, 1.4) });
    xf(head2, { x: -30 * (1 - E.out(P(u, 1.2, 1.8))), op: P(u, 1.2, 1.6) });
    kpi2.forEach((el, i) => pop(el, u, 1.3 + i * 0.08));
    const rw = E.inOut(P(u, 1.6, 2.4));
    recent.style.clipPath = `inset(0 0 ${(1 - rw) * 100}% 0 round 7px)`;
    const dw = E.inOut(P(u, 1.7, 2.5));
    detect.style.clipPath = `inset(0 ${(1 - dw) * 100}% 0 0 round 7px)`;

    // Ask Shift: the agent panel gets picked up and spotlit
    const dq = E.inOut(P(u, 3.5, 4.1)) * (1 - E.inOut(P(u, 6.0, 6.6)));
    scr.dim.style.opacity = 0.55 * dq;
    const aq = E.out5(P(u, 3.6, 4.4)) * (1 - E.inOut(P(u, 6.0, 6.6)));
    askCard.style.opacity = P(u, 3.55, 3.6);
    xf(askCard, { s: 1 + 0.08 * aq, x: -40 * aq, op: P(u, 3.55, 3.6) });
    lift(askCard, aq, 'rgba(98,70,220,.55)', 'rgba(124,92,255,.9)');

    const cin = E.out5(P(u, 0, 2.2)), tilt = E.inOut(P(u, 2.8, 4.6)), drift = E.sine(P(u, 2.8, 6.8));
    scr.cam({ s: lerp(0.94, 1, cin) + 0.06 * tilt, fx: 1100, fy: 260, rx: lerp(14, 0, cin) + 10 * tilt, ry: -16 * tilt - 4 * drift, y: (1 - cin) * 60 + 10 * tilt, x: -30 * tilt });
  };
});

// =====================================================================
// 3. ACCESS GRAPH — trace a path from vendor to data

scene(11.0, 17.5, root => {
  const cap = caption(root, '02 — Access', 'Trace every path from a vendor to your data.');
  const scr = makeScreen(root, '04-vendor-access-graph.webp', 705.8, 1440, 960, 628);
  scr.paper.style.opacity = 1;
  attachOverlay(scr);
  const defs = S('defs', {}, scr.overlay);
  defs.innerHTML = `<filter id="glowF" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#f7b24c"/><stop offset="1" stop-color="#ff7a45"/></linearGradient>`;
  const vendor = scr.slice(113, 166, 46, 46);
  const ident = scr.slice(217, 169, 152, 68);
  const more = scr.slice(433, 441, 151, 26);
  const resY = [171, 266, 360, 438, 515], resH = [86, 86, 72, 68, 68];
  const res = resY.map((y, i) => scr.slice(649, y - 2, 151, resH[i]));
  const panel = scr.slice(981, 31, 419, 675, 0);
  const paths = [
    { d: 'M151,188 C185,188 188,203 219,203', a: 1.3 },
    { d: 'M367,203 C412,203 392,453 435,453', a: 1.75 },
    ...[211, 307, 393, 470, 548].map((y, i) => ({ d: `M582,453 C622,453 612,${y} 651,${y}`, a: 2.35 + i * 0.1 })),
  ].map(p => {
    const g = S('g', {}, scr.overlay);
    const el = S('path', { d: p.d, fill: 'none', stroke: 'url(#lg)', 'stroke-width': 2.4, 'stroke-linecap': 'round', pathLength: 1, 'stroke-dasharray': 1, 'stroke-dashoffset': 1, filter: 'url(#glowF)' }, g);
    const dot = S('circle', { r: 4, fill: '#fff', stroke: '#ff8a45', 'stroke-width': 2, opacity: 0 }, g);
    return { el, dot, a: p.a, len: el.getTotalLength() };
  });
  // slices sit above the overlay so lines tuck under the nodes
  [vendor, ident, more, ...res, panel].forEach(s => scr.el.append(s));

  const light = (el, u, a, k = 0.05, glow = 'rgba(247,166,76,.9)') => {
    const q = E.out5(P(u, a, a + 0.6));
    xf(el, { s: 1 + k * q, op: P(u, a - 0.05, a + 0.1) });
    lift(el, q, 'rgba(0,0,0,.35)', glow);
  };
  return u => {
    renderCaption(cap, u, 6.0);
    scr.dim.style.opacity = 0.62 * E.inOut(P(u, 0.9, 1.5));
    paths.forEach(p => {
      const q = E.inOut(P(u, p.a, p.a + 0.55));
      p.el.setAttribute('stroke-dashoffset', 1 - q);
      const pt = p.el.getPointAtLength(p.len * q);
      p.dot.setAttribute('cx', pt.x); p.dot.setAttribute('cy', pt.y);
      p.dot.setAttribute('opacity', q > 0 && q < 1 ? 1 : 0);
    });
    light(vendor, u, 1.15, 0.12);
    light(ident, u, 1.75);
    light(more, u, 2.3, 0.04);
    res.forEach((el, i) => light(el, u, 2.85 + i * 0.1));
    const pq = E.out5(P(u, 4.0, 4.8));
    xf(panel, { x: 60 * (1 - pq), op: pq });
    const cin = E.out5(P(u, 0, 1.2)), push = E.inOut(P(u, 1.0, 6.5));
    scr.cam({ s: lerp(0.9, 1, cin) + 0.1 * push, fx: 520, fy: 380, x: 360 * (1 - cin) - 40 * push, ry: lerp(-28, 0, cin) + 6 * push, rx: 4 * push, op: P(u, 0, 0.3) });
  };
});

// 4. THREAT CENTER — alerts land, then the impacted vendors light up

scene(17.5, 23.5, root => {
  const cap = caption(root, '03 — Threats', 'Threats mapped to the vendors they actually touch.');
  const scr = makeScreen(root, '05-threat-center.webp', 705.8, 1440, 960, 628);
  attachOverlay(scr);
  const nav = scr.slice(0, 0, 1400, 40, 0);
  const title = scr.slice(0, 50, 1400, 38, 0);
  const stats = [13, 359, 705, 1050].map(x => scr.slice(x, 93, 337, 98));
  const search = scr.slice(10, 200, 285, 30, 0);
  const items = [0, 1, 2, 3, 4, 5, 6, 7].map(i => scr.slice(13, 236 + i * 62.8, 268, 57));
  const detail = scr.slice(296, 200, 1104, 506, 0);
  scr.el.append(scr.dim);
  const rows = [474, 507, 540].map(y => scr.slice(318, y, 784, 33, 3));
  const sel = scr.slice(13, 236, 268, 57);
  const titleHi = scr.slice(312, 225, 310, 26, 4);
  [rows, sel, titleHi].flat().forEach(s => s.style.opacity = 0);
  scr.el.append(scr.overlay);
  const rings = [490, 523, 556].map((cy, i) => S('circle', { cx: 707, cy, r: 6, fill: 'none', stroke: i ? '#f39a3d' : '#e5484d', 'stroke-width': 2, opacity: 0 }, scr.overlay));

  return u => {
    renderCaption(cap, u, 5.5);
    scr.paper.style.opacity = E.out5(P(u, 0, 0.6));
    scr.base.style.opacity = P(u, 2.1, 2.4);
    xf(nav, { y: -30 * (1 - E.out(P(u, 0.1, 0.6))), op: P(u, 0.1, 0.4) });
    xf(title, { y: -14 * (1 - E.out(P(u, 0.2, 0.7))), op: P(u, 0.2, 0.5) });
    stats.forEach((el, i) => {
      el.style.transformOrigin = '50% 0%';
      const q = E.out5(P(u, 0.35 + i * 0.09, 1.15 + i * 0.09));
      xf(el, { rx: -75 * (1 - q), op: P(u, 0.35 + i * 0.09, 0.6 + i * 0.09) });
    });
    xf(search, { op: P(u, 0.8, 1.1) });
    items.forEach((el, i) => {
      const q = E.out5(P(u, 0.9 + i * 0.06, 1.6 + i * 0.06));
      xf(el, { x: -90 * (1 - q), op: P(u, 0.9 + i * 0.06, 1.15 + i * 0.06) });
    });
    const dw = E.inOut(P(u, 1.25, 2.1));
    detail.style.clipPath = `inset(0 0 ${(1 - dw) * 100}% 0)`;

    const dq = E.inOut(P(u, 2.5, 3.1));
    scr.dim.style.opacity = 0.6 * dq;
    [sel, titleHi].forEach((el, i) => {
      const q = E.out5(P(u, 2.6 + i * 0.12, 3.2 + i * 0.12));
      xf(el, { s: 1 + 0.03 * q, op: P(u, 2.55 + i * 0.12, 2.7 + i * 0.12) });
      lift(el, q, 'rgba(0,0,0,.35)');
    });
    rows.forEach((el, i) => {
      const a = 3.0 + i * 0.18, q = E.out5(P(u, a, a + 0.6));
      xf(el, { s: 1 + 0.03 * q, x: 14 * q, op: P(u, a - 0.05, a + 0.1) });
      lift(el, q, 'rgba(0,0,0,.35)', i ? 'rgba(243,154,61,.9)' : 'rgba(229,72,77,.95)');
    });
    rings.forEach((r, i) => {
      const ph = ((u - 3.3 - i * 0.18) % 1.1 + 1.1) % 1.1, on = u > 3.3 + i * 0.18;
      const q = ph / 1.1;
      r.setAttribute('r', 6 + 22 * E.out(q));
      r.setAttribute('opacity', on ? (1 - q) * 0.9 : 0);
      r.setAttribute('transform', `translate(${14 / scr.k} 0)`);
    });
    const cin = E.out5(P(u, 0, 1.8)), push = E.inOut(P(u, 2.5, 6.0));
    scr.cam({ s: lerp(0.95, 1, cin) + 0.12 * push, fx: 640, fy: 520, rx: lerp(16, 0, cin) + 6 * push, ry: -8 * push, y: (1 - cin) * 50, x: -20 * push });
  };
});

scene(23.5, 28.5, root => {
  const cap = caption(root, '04 — Integrations', 'Plugged into the stack teams already run.');

});

// =====================================================================
// 6. ASSESSMENT — the agent proposes, a person decides

scene(28.5, 34.5, root => {
  const cap = caption(root, '05 — Assessment', 'The agent does the work. A person makes the call.');
  const scr = makeScreen(root, '07-assessment-flow-1.webp', 705.8, 1440, 960, 628);
  attachOverlay(scr);
  const card = scr.slice(233, 441, 367, 188, 14);
  const btn = scr.slice(346, 599, 86, 22, 5);
  btn.style.transformOrigin = '50% 50%';
  scr.el.append(scr.dim, card, btn, scr.overlay);
  const ripple = S('circle', { cx: 389, cy: 610, r: 0, fill: 'none', stroke: '#f7a64c', 'stroke-width': 2, opacity: 0 }, scr.overlay);
  const cursor = $('div', 'cursor', scr.el, `<svg viewBox="0 0 24 24" width="30" height="30"><path d="M4 2.5 L4 19.5 L8.6 15.4 L11.6 22 L14.6 20.6 L11.7 14.2 L17.8 14.2 Z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>`);
  const chip = $('div', 'chip', scr.el, '<b></b>Human decision');
  chip.style.left = 612 * scr.k + 'px'; chip.style.top = 586 * scr.k + 'px';
  const chip2 = $('div', 'chip', scr.el, '<b style="background:#9b87ff;box-shadow:0 0 12px #9b87ff"></b>Agent recommendation');
  chip2.style.left = 612 * scr.k + 'px'; chip2.style.top = 452 * scr.k + 'px';

  // the card starts alone in the middle of the frame
  const k = scr.k, ccx = (233 + 183.5) * k, ccy = (441 + 94) * k;
  const homeDX = scr.W / 2 - ccx, homeDY = scr.H / 2 - ccy - 30;
  return u => {
    renderCaption(cap, u, 5.5);
    const fly = E.inOut(P(u, 1.8, 2.9));
    const ein = E.out5(P(u, 0, 0.9));
    const float = Math.sin(u * 2.2) * 6 * (1 - fly);
    xf(card, { x: homeDX * (1 - fly), y: homeDY * (1 - fly) + (1 - ein) * 60 + float, s: lerp(lerp(1.6, 1.9, ein), 1, fly), op: P(u, 0, 0.35) });
    lift(card, 1 - fly * 0.6, 'rgba(70,50,180,.45)');
    const pv = E.out5(P(u, 2.0, 2.9));
    scr.paper.style.opacity = pv; scr.base.style.opacity = pv;
    btn.style.opacity = P(u, 2.85, 2.9);

    // cursor travels in, clicks "Make decision"
    const cq = E.inOut(P(u, 3.0, 4.0));
    const cx = lerp(1150, 392, cq) + Math.sin(cq * Math.PI) * 30, cy = lerp(760, 612, cq) - Math.sin(cq * Math.PI) * 80;
    const press = P(u, 4.0, 4.12) - P(u, 4.12, 4.35);
    cursor.style.opacity = P(u, 3.0, 3.2) * (1 - P(u, 4.9, 5.2));
    cursor.style.transform = `translate(${cx * k}px,${cy * k}px) scale(${1 - 0.15 * press})`;
    xf(btn, { s: 1 - 0.08 * press, op: P(u, 2.85, 2.9) });
    const rq = P(u, 4.05, 4.75);
    ripple.setAttribute('r', 6 + 46 * E.out(rq));
    ripple.setAttribute('opacity', rq > 0 && rq < 1 ? (1 - rq) * 0.9 : 0);
    lift(btn, E.out5(P(u, 4.1, 4.6)), 'rgba(247,166,76,.5)', 'rgba(247,166,76,1)');

    scr.dim.style.opacity = 0.55 * E.inOut(P(u, 4.3, 4.9));
    [chip2, chip].forEach((c, i) => {
      const q = E.back(P(u, 4.45 + i * 0.2, 5.05 + i * 0.2));
      c.style.opacity = P(u, 4.45 + i * 0.2, 4.6 + i * 0.2);
      c.style.transform = `translateX(${(1 - q) * -24}px) scale(${lerp(0.8, 1, q)})`;
    });
    const cin = E.out5(P(u, 1.9, 3.0)), push = E.inOut(P(u, 3.0, 6.0));
    scr.cam({ s: lerp(1.05, 1, cin) + 0.16 * push, fx: 430, fy: 540, rx: 5 * push, ry: 7 * push, x: -80 * push });
  };
});

scene(34.5, 39.5, root => {
  const wrap = $('div', '', root);
  Object.assign(wrap.style, { position: 'absolute', left: 0, right: 0, top: '370px', display: 'flex', flexDirection: 'column', alignItems: 'center' });
  const lock = $('div', '', wrap);
  Object.assign(lock.style, { display: 'flex', alignItems: 'center', gap: '22px', color: '#ecedf0' });
  const mark = $('div', '', lock, logoSvg(108, '#ecedf0'));

  Object.assign(word.style, { fontSize: '112px', fontWeight: 600, letterSpacing: '-.04em', display: 'flex', overflow: 'hidden', paddingBottom: '10px' });
  const letters = 'Shift'.split('').map(ch => $('span', '', word, ch));
  letters.forEach(l => l.style.display = 'inline-block');
  const bar = $('div', '', wrap);
  Object.assign(bar.style, { height: '3px', borderRadius: '3px', marginTop: '34px', background: 'linear-gradient(90deg,#2c3192,#8f6f86,#f9b44d)' });
  const tag = $('div', '', wrap);
  Object.assign(tag.style, { marginTop: '34px', fontSize: '32px', color: '#b5b8c4', letterSpacing: '-.01em', textAlign: 'center', lineHeight: 1.35 });
  tag.innerHTML = 'Agent-led third-party security,<br>with people accountable for the decisions.'
    .split(/(<br>| )/).filter(s => s !== ' ').map(s => s === '<br>' ? s : `<span class="w"><span>${s}</span></span>`).join(' ');
  const words = [...tag.querySelectorAll('.w > span')];
  const sub = $('div', '', wrap, 'Now publicly available');
  Object.assign(sub.style, { marginTop: '40px', fontSize: '16px', letterSpacing: '.2em', textTransform: 'uppercase', color: '#f2a65a', fontWeight: 500 });

  return u => {

    mark.style.transform = `scale(${lerp(0.6, 1, mq)}) rotate(${(1 - mq) * -25}deg)`; mark.style.opacity = P(u, 0.25, 0.5);
    letters.forEach((l, i) => { const q = E.out5(P(u, 0.45 + i * 0.06, 1.2 + i * 0.06)); l.style.transform = `translateY(${(1 - q) * 110}%)`; });
    bar.style.width = 420 * E.inOut(P(u, 1.0, 2.0)) + 'px';
    words.forEach((w, i) => { const q = E.out5(P(u, 1.3 + i * 0.045, 2.1 + i * 0.045)); w.style.transform = `translateY(${(1 - q) * 110}%)`; });
    const sq = E.out5(P(u, 2.4, 3.1)); sub.style.opacity = sq; sub.style.transform = `translateY(${(1 - sq) * 12}px)`;
    wrap.style.transform = `scale(${1 + 0.03 * E.sine(P(u, 0, 5))})`;
  };
});

// ---------- master timeline ----------
const CUTS = [4.2, 11.0, 17.5, 23.5, 28.5, 34.5];
const band = document.getElementById('band'), band2 = document.getElementById('band2');
const DURATION = 39.5;
window.DURATION = DURATION;
window.render = t => {
  for (const s of scenes) {
    const on = t >= s.start && t < s.end;
    s.root.style.display = on ? 'block' : 'none';
    if (on) s.render(t - s.start);
  }
  // wipe: a gradient band sweeps across, trailed by a dark band; the cut happens under them
  let bx = -3000, b2x = -3000;
  for (const c of CUTS) {
    const q = P(t, c - 0.45, c + 0.55);
    if (q > 0 && q < 1) {
      bx = lerp(-2700, 2300, E.inOut(q));
      b2x = lerp(-2700, 2300, E.inOut(clamp(q - 0.09, 0, 1) / 0.91));
    }
  }
  band.style.left = bx + 'px';
  band2.style.left = (b2x - 260) + 'px';
  band2.style.width = '2140px';
  document.getElementById('fade').style.opacity = P(t, DURATION - 0.6, DURATION);
  document.getElementById('glow').style.transform = `translate(${Math.sin(t * 0.25) * 40}px, ${Math.cos(t * 0.2) * 30}px)`;
};

window.ready = (async () => {
  await document.fonts.ready;
  const files = ['01-shift-dashboard.webp', '04-vendor-access-graph.webp', '05-threat-center.webp', '06-integrations-grid.jpg', '07-assessment-flow-1.webp'];
  await Promise.all(files.map(f => { const i = new Image(); i.src = IMG + f; return i.decode(); }));
  await Promise.all(['400', '500', '600'].map(w => document.fonts.load(`${w} 40px Geist`)));
  const t = parseFloat(new URLSearchParams(location.search).get('t') || '0');
  window.render(t);
  return true;
})();
</script>
